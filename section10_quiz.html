/* ========== TOPIC 9.3 — MANAGERIAL ACCOUNTING TERMINOLOGY: CVP TERMS ========== */

{type:'mc',
 q:'Cost-Volume-Profit (CVP) Analysis, sometimes called breakeven analysis, is best defined as:',

 mnemonic:'💡 Memory tip: CVP = Cost, Volume, Profit — how the three move together.'},

 q:'A variable cost is best defined as:',

       'A cost that can never be changed by a future decision'],
 correct:0,
 explanation:'Variable costs rise directly with production/sales volume. Classic example: hamburger meat cost — 0 burgers = $0 meat cost, 1,000 burgers = $500 meat cost.',
 mnemonic:'💡 Memory tip: Variable = "varies with volume."'},

{type:'mc',
 q:'A fixed cost is best defined as:',
 opts:['A cost that doesn\'t change based on the level of sales or production',

       'A cost incurred only when a product is sold',
       'A cost that can be changed by a decision made right now'],
 correct:0,
 explanation:'Fixed costs, like rent, stay the same whether you sell 1 unit or 1,000 units (within a reasonable range).',
 mnemonic:'💡 Memory tip: Fixed = "frozen" — it doesn\'t move no matter what volume does.'},

{type:'tf',
 q:'The more units a company produces and sells, the higher its total variable costs will be.',
 opts:['True','False'],
 correct:0,
 explanation:'True — that\'s the defining feature of a variable cost. More hamburgers sold means more total spent on meat.',
 mnemonic:'💡 Memory tip: Variable costs and volume move in the same direction, like two dance partners.'},

{type:'tf',
 q:'Fixed cost PER UNIT stays exactly the same no matter how many units a company produces.',
 opts:['True','False'],
 correct:1,
 explanation:'False. TOTAL fixed cost stays the same, but fixed cost PER UNIT actually decreases as production volume increases, because the same total is spread across more units. (Example: $5,000 rent ÷ 2,000 units = $2.50/unit, but $5,000 ÷ 3,000 units = only $1.67/unit.)',
 mnemonic:'💡 Memory tip: "Per" means divided by — the same numerator spread over a bigger denominator always shrinks.'},

{type:'mc',
 q:'Lily Company has total fixed costs of $48,000 for the period. Each unit sells for $40, and the variable cost per unit is $24. How many units must Lily sell to break even?',
 opts:['3,000 units',
       '4,000 units',
       '1,200 units',
       '2,000 units'],
 correct:0,
 explanation:'Contribution margin per unit = $40 − $24 = $16. Units to break even = Fixed Costs ÷ CM per unit = $48,000 ÷ $16 = 3,000 units. This formula (Fixed Costs ÷ Contribution Margin per unit) isn\'t printed on the official formula sheet, so it\'s worth memorizing directly.',
 mnemonic:'💡 Memory tip: Each unit "contributes" $16 toward covering fixed costs after variable cost is paid — you need enough $16 contributions to add up to $48,000.'},

{type:'mc',
 q:'Using the same Lily Company data (Fixed Costs $48,000, selling price $40/unit, variable cost $24/unit), how much SALES REVENUE must Lily generate to break even?',
 opts:['$120,000',
       '$48,000',
       '$80,000',
       '$200,000'],
 correct:0,
 explanation:'Contribution margin ratio = CM per unit ÷ price = $16 ÷ $40 = 40%. Sales$ to break even = Fixed Costs ÷ CM ratio = $48,000 ÷ 0.40 = $120,000. Sanity check: 3,000 breakeven units × $40/unit = $120,000 — same answer either way. Like the units formula, this ratio-based formula isn\'t on the official formula sheet either.',
 mnemonic:'💡 Memory tip: Whichever path you take — units × price, or Fixed Costs ÷ CM ratio — you should land on the same breakeven dollar figure.'},

/* ========== TOPIC 9.3 — PRODUCT COSTS VS. PERIOD COSTS ========== */

{type:'mc',
 q:'A product cost is best defined as:',
 opts:['A cost incurred as part of the production process (inside the factory); first reported as an asset (inventory), then as an expense (COGS) when sold',
       'A cost incurred outside the factory, reported as an expense in the period it\'s incurred',
       'A cost that can be changed by a decision made right now',
       'The benefit lost by not choosing an alternative'],
 correct:0,
 explanation:'Product costs "attach" to the inventory itself. They sit on the balance sheet as an asset until the product is sold, at which point they flow to the income statement as Cost of Goods Sold.',
 mnemonic:'💡 Memory tip: Product costs ride along with the product, all the way to the sale.'},

{type:'mc',
 q:'A period cost is best defined as:',
 opts:['A cost incurred outside the factory or production facility, reported as an expense in the period in which it is incurred',
       'A cost incurred inside the production facility, first recorded as inventory',
       'A cost that changes as a result of a decision made now',
       'A cost involving an outlay of cash or another asset'],
 correct:0,
 explanation:'Period costs happen outside the factory — corporate HQ, advertising, sales commissions, interest — and are expensed in the period they occur, regardless of whether anything was sold.',
 mnemonic:'💡 Memory tip: Period costs are expensed on a calendar, not on a sale.'},

{type:'mc',
 q:'When do product costs become an expense on the income statement?',
 opts:['When the product is finally sold (they become Cost of Goods Sold)',
       'The moment raw materials are purchased',
       'At the end of every calendar month regardless of sales',
       'Product costs are never expensed — only period costs are'],
 correct:0,
 explanation:'Product costs sit on the balance sheet as inventory (an asset) until the product sells — only then do they flow to the income statement as Cost of Goods Sold.',
 mnemonic:'💡 Memory tip: No sale, no expense yet — product costs wait in inventory until the product walks out the door.'},

/* ========== TOPIC 9.3 — DECISION-MAKING COST TERMS ========== */

{type:'mc',
 q:'A direct cost is best defined as:',
 opts:['A cost that is specifically traceable to a unit of business or segment being analyzed — if that segment is dropped, the cost disappears',
       'A cost normally incurred for the benefit of several segments within the organization',
       'A cost that stays the same regardless of the decision made',
       'A cost that involves the outlay of cash'],
 correct:0,
 explanation:'Direct costs are tied specifically to the product/division in question. If you shut that division down, the direct cost goes away with it — e.g., the division manager\'s salary.',
 mnemonic:'💡 Memory tip: Direct cost = "created by this thing specifically; disappears if this thing goes away."'},

{type:'mc',
 q:'An indirect cost is best defined as:',
 opts:['A cost normally incurred for the benefit of several segments within the organization, sometimes called a common or joint cost',
       'A cost specifically traceable to a single unit or segment being analyzed',
       'A future cost that can be changed by a decision made now',
       'The benefit lost by not choosing an alternative'],
 correct:0,
 explanation:'Indirect costs — like corporate headquarters overhead — benefit multiple segments at once. They\'re only loosely (indirectly) connected to any one segment, so they don\'t disappear if a single segment is dropped.',
 mnemonic:'💡 Memory tip: Indirect cost = "shared by everyone; sticks around even if this one thing goes away."'},

{type:'tf',
 q:'If a product line or business segment is dropped, the DIRECT costs created by that segment will disappear.',
 opts:['True','False'],
 correct:0,
 explanation:'True — direct costs are specifically caused by that segment, so eliminating the segment eliminates those costs (e.g., the division manager is let go, materials are no longer purchased).',
 mnemonic:'💡 Memory tip: Direct costs are attached at the hip to the segment — cut the segment, cut the cost.'},

{type:'tf',
 q:'If a product line or business segment is dropped, the INDIRECT costs assigned to that segment will also disappear.',
 opts:['True','False'],
 correct:1,
 explanation:'False — indirect (common/joint) costs, like corporate headquarters expenses, remain even after a segment is dropped, because they were never actually caused by that one segment in the first place.',
 mnemonic:'💡 Memory tip: Corporate HQ doesn\'t shrink just because one division closes — those costs were never really "theirs" alone.'},

{type:'mc',
 q:'A differential cost is best defined as:',
 opts:['A future cost that can be changed by a decision made now; also called an incremental or relevant cost',
       'A past cost that cannot be changed by any decision made now',
       'A cost specifically traceable to one segment',
       'A cost involving an outlay of cash'],
 correct:0,
 explanation:'Differential costs are the ones that actually respond to your current decision — for example, realtor fees only occur if you decide to sell your house.',
 mnemonic:'💡 Memory tip: Differential = "makes a difference" depending on what you decide right now.'},

{type:'mc',
 q:'A sunk cost is best defined as:',
 opts:['A past cost that cannot be changed by any decision made now',
       'A future cost that changes based on the decision made now',
       'A cost incurred for the benefit of multiple segments',
       'A benefit forfeited by not choosing an alternative'],
 correct:0,
 explanation:'Sunk costs are already spent and gone — "spilled milk." What you originally paid for your house can\'t be changed by your decision to sell it today.',
 mnemonic:'💡 Memory tip: Sunk = it already sank to the bottom; no decision today can bring it back up.'},

{type:'tf',
 q:'When making a business decision, sunk costs should be given significant weight because they represent real money already spent.',
 opts:['True','False'],
 correct:1,
 explanation:'False. Even though sunk costs are real money spent, they should be IGNORED in decision-making because no current decision can change them. (This is psychologically hard to do — it\'s part of why housing markets adjust slowly, as sellers fixate on what they originally paid.)',
 mnemonic:'💡 Memory tip: Spilled milk — no amount of crying about the sunk cost will un-spill it, so leave it out of the decision.'},

{type:'mc',
 q:'An out-of-pocket cost is best defined as:',
 opts:['A cost that involves the outlay of cash or use of some other asset (like equipment)',
       'A benefit lost by not choosing an alternative course of action',
       'A cost that cannot be changed by a decision made now',
       'A cost incurred for the benefit of several segments'],
 correct:0,
 explanation:'Out-of-pocket costs are the ones you can literally feel — you have to actually pay cash or use up a resource, like paying landscapers to maintain Central Park.',
 mnemonic:'💡 Memory tip: Out-of-pocket = money (or resources) actually leaves your pocket.'},

{type:'mc',
 q:'An opportunity cost is best defined as:',
 opts:['The benefits not received because of actions NOT taken',
       'A cost that involves an actual outlay of cash',
       'A cost that is specifically traceable to one segment',
       'A cost that disappears if a segment is dropped'],
 correct:0,
 explanation:'Opportunity cost is what you give up by not choosing an alternative — for example, NYC\'s biggest "cost" of keeping Central Park undeveloped is the enormous rent it could have earned leasing that land commercially. It\'s a real economic cost, but it\'s easy to overlook because no cash actually changes hands.',
 mnemonic:'💡 Memory tip: Opportunity cost = the road not taken, and what you missed by not taking it.'},

{type:'dd',
 q:'Match each business question/scenario to the cost-term pair it\'s testing.',
 cols:['Fixed/Variable','Product/Period','Direct/Indirect','Differential/Sunk','Out-of-pocket/Opportunity'],
 items:[
   {text:'Given the cost structure, will sales be high enough to break even?', answer:'Fixed/Variable'},
   {text:'What is the cost per unit to make a product?', answer:'Product/Period'},
   {text:'Should we close down this division?', answer:'Direct/Indirect'},
   {text:'Should I sell my current house and buy a new one?', answer:'Differential/Sunk'},
   {text:'What is the true annual cost to New York City of maintaining Central Park?', answer:'Out-of-pocket/Opportunity'}
 ],
 explanation:'Each cost-term pair exists to answer a specific type of business question: Fixed/Variable underlies breakeven analysis; Product/Period underlies per-unit costing; Direct/Indirect underlies drop-a-segment decisions; Differential/Sunk underlies any "should we do X" decision; Out-of-pocket/Opportunity underlies the true full cost of any choice, including costs with no cash outlay.',
 mnemonic:'💡 Memory tip: Match the QUESTION\'s shape to the term pair — "break even?" = Fixed/Variable. "Cost per unit?" = Product/Period. "Drop it?" = Direct/Indirect. "Change my mind now?" = Differential/Sunk. "What am I really giving up?" = Out-of-pocket/Opportunity.'},
