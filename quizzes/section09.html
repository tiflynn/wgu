const questions = [

/* ========== TOPIC 8.1 — TYPES OF PROBLEMS THAT CAN OCCUR ========== */

{type:'mc',
 q:'The notes identify three types of problems that can appear in financial statements. What are they?',
 opts:['Errors, Disagreements, and Frauds',
       'Errors and Fraud only — there are two categories, not three',
       'Mistakes, Misstatements, and Misappropriations',
       'Errors, Fraud, and Negligence'],
 correct:0,
 explanation:'The notes lay out three distinct categories of problems: Errors (unintentional), Disagreements (differing judgments and estimates — not really "wrong," just different reasonable views), and Frauds (intentional lies). This is broader than a simple "errors vs. fraud" split — Disagreements is its own middle category because it isn\'t about anyone being wrong, just about legitimate differences in professional judgment.',
 mnemonic:'💡 Memory tip: E-D-F — Errors, Disagreements, Frauds. Think of grading a paper: some things are flat-out wrong (errors), some are reasonable judgment calls (disagreements), and some are outright lies (frauds).'},

{type:'ms',
 q:'Which of the following are examples of ERRORS (unintentional problems)? Select all that apply.',
 opts:['Transactions recorded for the wrong amounts',
       'Transactions not recorded at all',
       'The same transaction recorded more than once',
       'A transaction recorded in the wrong account',
       'Incorrect physical counts',
       'Deliberately overstating revenue to attract new investors',
       'Estimating a building\'s useful life at 25 years instead of 30'],
 correctSet:[0,1,2,3,4],
 explanation:'The five examples of errors are all unintentional bookkeeping mistakes: wrong amounts, missed transactions, duplicate entries, wrong accounts, and incorrect physical counts. "Deliberately overstating revenue" is fraud (intentional), and "estimating useful life" is a disagreement (a judgment call), not a mechanical mistake.',
 mnemonic:'💡 Memory tip: Errors are what a tired bookkeeper does by accident — wrong number, missing entry, double entry, wrong bucket, miscount. No intent, no judgment call — just a slip.'},

{type:'ms',
 q:'Which of the following are examples of DISAGREEMENTS (differing judgments and estimates), rather than errors or fraud? Select all that apply.',
 opts:['The expected useful life of a building',
       'The percentage of work completed on a long-term contract',
       'The amount of existing accounts receivable that will ultimately be collected',
       'The number of products that will be returned for warranty service',
       'The likelihood that a company will lose a lawsuit',
       'A bookkeeper accidentally entering an invoice twice',
       'Inventing fictitious customers to inflate reported revenue'],
 correctSet:[0,1,2,3,4],
 explanation:'Disagreements all involve legitimate estimates where reasonable people could land on different numbers — useful life, percent-complete, collectibility, warranty returns, and lawsuit outcomes are all judgment calls, not objective facts. Double-entering an invoice is an error (a mechanical slip), and inventing fictitious customers is fraud (an intentional lie).',
 mnemonic:'💡 Memory tip: Disagreements = "I don\'t know for sure, and neither do you." Nobody can know exactly how long a building lasts or whether a lawsuit will be lost — that\'s a forecast, not a fact.'},

{type:'dd',
 q:'Match each scenario to the correct problem category.',
 cols:['Errors','Disagreements','Frauds'],
 items:[
   {text:'A transaction is recorded in the wrong account by mistake', answer:'Errors'},
   {text:'The same invoice is accidentally entered into the books twice', answer:'Errors'},
   {text:'Management estimates a warranty return rate that turns out to differ from actual results', answer:'Disagreements'},
   {text:'Two accountants reasonably disagree on how many years a building will last', answer:'Disagreements'},
   {text:'A manager fabricates sales figures to secure a bank loan', answer:'Frauds'},
   {text:'A company hides liabilities specifically to attract new investors', answer:'Frauds'}
 ],
 explanation:'The key distinguishing question for each scenario: was it a mechanical slip (Error), a legitimate judgment call with no right answer (Disagreement), or an intentional lie meant to deceive (Fraud)? Mapping scenarios to the right bucket is exactly the skill this LO tests.',
 mnemonic:'💡 Memory tip: Ask "was there intent?" No intent + mechanical = Error. No intent + it\'s a forecast = Disagreement. Intent to deceive = Fraud.'},

{type:'mc',
 q:'Fraud itself breaks down into two distinct types. What are they?',
 opts:['Misappropriation (stealing) and Fraudulent Financial Reporting (lying)',
       'Embezzlement and Bribery',
       'Tax Evasion and Money Laundering',
       'Internal Fraud and External Fraud'],
 correct:0,
 explanation:'The two types of fraud are Misappropriation — physically stealing company assets (cash, inventory) — and Fraudulent Financial Reporting — intentionally lying within the financial statements themselves (e.g., overstating revenue or hiding liabilities).',
 mnemonic:'💡 Memory tip: Misappropriation = "sticky fingers" (taking assets). Fraudulent financial reporting = "sticky pen" (lying on paper).'},

{type:'mc',
 q:'Which type of fraud involves an employee physically stealing company assets, such as cash or inventory?',
 opts:['Misappropriation',
       'Fraudulent Financial Reporting',
       'A Disagreement',
       'An Error'],
 correct:0,
 explanation:'Misappropriation is the theft-based type of fraud — someone takes assets that belong to the company. It often then requires falsifying records to cover up the theft.',
 mnemonic:'💡 Memory tip: Misappropriation sounds like "mis-appropriating" company property for yourself — a fancy word for stealing.'},

{type:'mc',
 q:'Which type of fraud involves intentionally lying within the financial statements themselves, such as overstating revenue or hiding liabilities?',
 opts:['Fraudulent Financial Reporting',
       'Misappropriation',
       'A Disagreement',
       'An Error'],
 correct:0,
 explanation:'Fraudulent Financial Reporting is lying about the numbers themselves — deliberately misstating results to make the company look better (or occasionally worse) than it actually is.',
 mnemonic:'💡 Memory tip: Fraudulent Financial REPORTING = lying in the REPORT — the numbers on the page are the lie, not a theft of physical assets.'},

{type:'ms',
 q:'According to the notes, why might someone commit fraud? Select all that apply.',
 opts:['To get a bank loan',
       'To attract new investors',
       'To increase a manager\'s bonus',
       'To comply with SEC filing deadlines',
       'To reduce a legitimate tax deduction'],
 correctSet:[0,1,2],
 explanation:'The notes list three motivations for fraud: securing a bank loan, attracting new investors, and increasing a manager\'s bonus. Complying with filing deadlines and reducing legitimate deductions aren\'t fraud motivations — they\'re normal, legal business activities.',
 mnemonic:'💡 Memory tip: Fraud usually chases money coming IN — a loan, an investor, or a bonus. Three ways to make yourself look better to get paid.'},

{type:'ms',
 q:'Fraud is committed with the intent to deceive which of the following groups? Select all that apply.',
 opts:['Employees',
       'Suppliers',
       'Government regulators',
       'The public',
       'Only the company\'s direct competitors'],
 correctSet:[0,1,2,3],
 explanation:'The notes list four groups that fraud is intended to deceive: employees, suppliers, government regulators, and the public. It\'s not limited to competitors — in fact, competitors are rarely the target of financial statement fraud at all.',
 mnemonic:'💡 Memory tip: Fraud deceives everyone with a stake in trusting the numbers — the people who work there, sell to them, regulate them, and invest with them.'},

{type:'mc',
 q:'What is used to make sure ERRORS don\'t happen in financial statements?',
 opts:['Internal controls — a well-designed information system and careful human procedures',
       'External auditors and market punishment',
       'Legal enforcement and the SEC',
       'Self-regulation to protect reputation, alone'],
 correct:0,
 explanation:'Errors are unintentional, so the fix is preventive: build a well-designed information system and train people to follow careful procedures. This is different from the safeguards used for disagreements or fraud, which involve outside parties like auditors.',
 mnemonic:'💡 Memory tip: Errors are accidents — you prevent accidents with good systems and careful habits, not with lawyers or regulators.'},

{type:'mc',
 q:'What helps minimize the impact of DISAGREEMENTS (differing judgments and estimates)?',
 opts:['Auditors and self-regulation to protect reputation',
       'Internal controls only',
       'Legal enforcement and market punishment',
       'The PCAOB exclusively'],
 correct:0,
 explanation:'Since disagreements are legitimate judgment calls rather than mistakes or lies, the safeguard is having auditors review whether the estimate is reasonable, plus companies\' own incentive to self-regulate in order to protect their reputation for sound judgment.',
 mnemonic:'💡 Memory tip: You can\'t "control" a judgment call away — you need someone independent (an auditor) to sanity-check it, plus the company\'s own desire to look credible.'},

{type:'ms',
 q:'What helps minimize the impact of FRAUD? Select all that apply.',
 opts:['Auditors',
       'Market punishment',
       'Legal enforcement',
       'Careful human procedures, alone'],
 correctSet:[0,1,2],
 explanation:'Fraud, being intentional deception, requires the strongest safeguards: auditors to catch it, the market punishing companies whose fraud is discovered (stock price drops, loss of trust), and legal enforcement (SOX, the SEC, criminal prosecution) to deter and penalize it. "Careful human procedures" alone is the safeguard for errors, not fraud — fraud is intentional, so procedures alone won\'t stop someone determined to deceive.',
 mnemonic:'💡 Memory tip: Fraud needs a three-front defense: auditors catch it, the market punishes it, and the law prosecutes it.'},

{type:'dd',
 q:'Match each type of problem to its primary safeguard(s).',
 cols:['Errors','Disagreements','Fraud'],
 items:[
   {text:'Internal controls — a well-designed information system and careful human procedures', answer:'Errors'},
   {text:'Auditors and self-regulation to protect reputation', answer:'Disagreements'},
   {text:'Auditors, market punishment, and legal enforcement', answer:'Fraud'}
 ],
 explanation:'Each problem type has a matched safeguard: Errors are prevented with good systems and careful procedures; Disagreements are checked by auditors and self-regulation; Fraud requires the heaviest response — auditors plus market and legal consequences.',
 mnemonic:'💡 Memory tip: The bigger the intent to deceive, the bigger the defense — Errors get systems, Disagreements get oversight, Fraud gets the full arsenal.'},

/* ========== TOPIC 8.2 — SAFEGUARDS DESIGNED TO MINIMIZE PROBLEMS ========== */

{type:'ms',
 q:'Internal controls accomplish five objectives. Select all that apply.',
 opts:['Provide accurate accounting records',
       'Safeguard assets and records',
       'Effectively and efficiently run operations',
       'Comply with management policies',
       'Comply with laws and regulations',
       'Maximize short-term stock price',
       'Eliminate the need for external audits entirely'],
 correctSet:[0,1,2,3,4],
 explanation:'The five objectives of internal controls are: accurate accounting records, safeguarding assets/records, running operations effectively and efficiently, following management policies, and complying with laws and regulations. Internal controls do not exist to boost stock price, and they never eliminate the need for external audits — they work alongside auditors, not instead of them.',
 mnemonic:'💡 Memory tip: A-S-E-P-C — Accurate records, Safeguard assets, Efficient operations, Policy compliance, and legal Compliance. Five objectives, one system.'},

{type:'mc',
 q:'Which of the five objectives of internal control is described as making sure "the organization does the things that it wants to do"?',
 opts:['Effectively and efficiently run operations',
       'Safeguard assets and records',
       'Comply with management policies',
       'Provide accurate accounting records'],
 correct:0,
 explanation:'This objective is about operational effectiveness and efficiency — internal controls exist partly to make sure the organization actually accomplishes its own goals, not just that it avoids errors or theft.',
 mnemonic:'💡 Memory tip: "Does the things it wants to do" = effectiveness and efficiency, plain and simple — controls keep the org on-mission, not just honest.'},

{type:'ms',
 q:'Per the notes, what did the Sarbanes-Oxley Act do (high-level summary)? Select all that apply.',
 opts:['Created the PCAOB',
       'Strengthened rules regarding auditor independence',
       'Required senior executives to take personal responsibility for financial reports',
       'Enhanced financial disclosures',
       'Beefed up penalties for white-collar crime and corporate fraud',
       'Eliminated the requirement for external audits',
       'Gave the FASB legal authority to prosecute fraud cases'],
 correctSet:[0,1,2,3,4],
 explanation:'SOX\'s five headline actions: created the PCAOB, strengthened auditor independence rules, made executives personally responsible for their financial reports, enhanced disclosures, and increased penalties for fraud. It did not eliminate audits — if anything, it made auditing more rigorous — and the FASB (a private standard-setting body) has no prosecutorial authority.',
 mnemonic:'💡 Memory tip: SOX = tougher oversight (PCAOB), tougher independence, personal accountability, more disclosure, harsher penalties. Everything got stricter, nothing got easier.'},

{type:'ms',
 q:'A company\'s internal control structure can be divided into five basic categories, per the detailed framework in the notes. Select all that apply.',
 opts:['The Control Environment',
       'Risk Assessment',
       'Control Activities',
       'Information and Communication',
       'Monitoring',
       'Budgeting',
       'Tax Compliance'],
 correctSet:[0,1,2,3,4],
 explanation:'The five detailed categories are: Control Environment, Risk Assessment, Control Activities, Information and Communication, and Monitoring. Budgeting and Tax Compliance are real business functions, but they aren\'t part of this internal control structure framework.',
 mnemonic:'💡 Memory tip: C-R-C-I-M — Control environment, Risk assessment, Control activities, Information/communication, Monitoring. The "control activities" piece is the one broken down further into the five specific activities you\'ll see next.'},

{type:'mc',
 q:'How is "The Control Environment" defined in the notes?',
 opts:['The actions, policies, and procedures that reflect the overall attitudes of top management about control and its importance to the entity',
       'The physical office space where accounting records are stored',
       'The set of laws that govern how a company must report earnings',
       'The software system used to record transactions'],
 correct:0,
 explanation:'The Control Environment is about tone at the top — it reflects how seriously top management takes control and integrity, which sets the tone for everyone below them. This matches the transcript\'s point that "it starts at the top."',
 mnemonic:'💡 Memory tip: The Control Environment is the company\'s "weather" — set entirely by the attitude of the people at the top. If leadership is cloudy on ethics, the whole company gets rained on.'},

{type:'mc',
 q:'"Control Activities" are best defined as:',
 opts:['Policies and procedures used by management to meet their objectives',
       'The physical layout of a company\'s accounting department',
       'The rules set by the SEC for all public companies',
       'A synonym for the control environment'],
 correct:0,
 explanation:'Control Activities are the specific, hands-on policies and procedures a company uses to make sure objectives are met — this is the category that breaks down further into the five specific activities (segregation of duties, authorization, physical control, documents/records, independent checks).',
 mnemonic:'💡 Memory tip: If the Control Environment is the "why" (tone at the top), Control Activities are the "how" (the actual day-to-day procedures).'},

{type:'ms',
 q:'Control activities include five specific types. Select all that apply.',
 opts:['Adequate segregation of duties',
       'Proper procedures for authorization',
       'Physical control over assets and records',
       'Adequate documents and records',
       'Independent checks on performance',
       'Risk Assessment',
       'Monitoring'],
 correctSet:[0,1,2,3,4],
 explanation:'The five control activities are segregation of duties, authorization procedures, physical control, adequate documents/records, and independent checks. Risk Assessment and Monitoring are separate top-level categories within the broader internal control structure — they are NOT themselves control activities, which is an easy trap.',
 mnemonic:'💡 Memory tip: S-A-P-D-I — Segregation, Authorization, Physical control, Documents/records, Independent checks. Don\'t confuse these five with the five bigger structural categories — Risk Assessment and Monitoring live one level up.'},

{type:'mc',
 q:'"Hands that touch assets do not also touch the accounting records for those assets" is the definition of which control activity?',
 opts:['Segregation of duties',
       'Proper procedures for authorization',
       'Physical control over assets and records',
       'Independent checks on performance'],
 correct:0,
 explanation:'This is the textbook definition of segregation of duties — the same person shouldn\'t be able to both handle an asset and record what happened to it, since that combination makes theft (and covering it up) easy.',
 mnemonic:'💡 Memory tip: The classic cash register example — the cashier touches the cash, but the machine (not the cashier) keeps the record. Hands and records stay separate.'},

{type:'mc',
 q:'"Only approved actions should take place" describes which control activity?',
 opts:['Proper procedures for authorization',
       'Segregation of duties',
       'Physical control over assets and records',
       'Independent checks on performance'],
 correct:0,
 explanation:'Proper authorization means actions can only be taken by people who have been specifically granted the authority to take them (e.g., only certain people can approve a large purchase or hire new staff).',
 mnemonic:'💡 Memory tip: Think "permission slip" — before an action happens, someone with the right authority has to sign off on it.'},

{type:'ms',
 q:'Which of the following are examples of physical control over assets and records? Select all that apply.',
 opts:['Locked doors and file cabinets',
       'Physical partitions',
       'Cameras for remote observation of assets',
       'Systems of backup for computer records',
       'Segregation of duties',
       'Mandatory vacations'],
 correctSet:[0,1,2,3],
 explanation:'Physical control is about literally protecting assets and records: locks, partitions, cameras, and computer backups. Segregation of duties and mandatory vacations are both examples of a different control activity — independent checks / proper role design — not physical control.',
 mnemonic:'💡 Memory tip: Physical control = anything you could literally touch or point a camera at — locks, walls, cameras, backups.'},

{type:'dd',
 q:'Match each term to its correct definition within "Adequate Documents and Records."',
 cols:['Documents','Records'],
 items:[
   {text:'Methods of gathering data from the environment (forms, sequentially numbered documents, computer inputs from customers/suppliers)', answer:'Documents'},
   {text:'The accounting system itself', answer:'Records'}
 ],
 explanation:'"Documents" are how data enters the system from the outside world — forms, numbered paperwork, computer entries. "Records" are the accounting system that stores and organizes that data once it\'s in.',
 mnemonic:'💡 Memory tip: Documents come IN from the outside world; Records live INSIDE the accounting system.'},

{type:'ms',
 q:'"Independent checks on performance" includes which of the following? Select all that apply.',
 opts:['External Auditors',
       'Internal Auditors',
       'Rotation of Duties',
       'Segregation of duties',
       'Physical partitions'],
 correctSet:[0,1,2],
 explanation:'Independent checks means someone comes along, periodically or unexpectedly, and verifies that things are actually as they appear — external auditors, internal auditors, and rotating people through different duties (including mandatory vacations) all serve this purpose.',
 mnemonic:'💡 Memory tip: "Someone\'s looking over your shoulder" — auditors (inside and outside) and duty rotation all mean you can\'t get too comfortable hiding something.'},

{type:'tf',
 q:'Mandatory vacations and rotation of duties are examples of independent checks on performance, since forcing someone to be away can expose fraud they were covering up.',
 opts:['True','False'],
 correct:0,
 explanation:'True. If someone is committing ongoing fraud, they often need to be physically present to keep covering it up (e.g., intercepting a customer complaint about a missing payment). Force them to take a mandatory vacation or rotate to a new role, and the scheme frequently comes to light.',
 mnemonic:'💡 Memory tip: Fraud often needs a constant babysitter — take the fraudster on vacation, and the babysitting stops.'},

/* ========== TOPIC 8.3 — REASONS FOR EARNINGS MANAGEMENT ========== */

{type:'mc',
 q:'Earnings management is best defined as:',
 opts:['The strategic choice of accounting estimates and judgments in order to meet pre-determined financial statement targets',
       'The intentional theft of company assets by an employee',
       'A synonym for external auditing',
       'The process of correcting unintentional bookkeeping errors'],
 correct:0,
 explanation:'Earnings management is specifically about strategically choosing among legitimate accounting estimates/judgments in order to land on a pre-set target number — it\'s not about theft, auditing, or fixing mistakes.',
 mnemonic:'💡 Memory tip: Earnings management = picking the estimate that gets you to the number you already had in mind, not the number that just falls out naturally.'},

{type:'ms',
 q:'According to the notes, why do managers manage earnings? Select all that apply.',
 opts:['To meet internal targets',
       'To meet external expectations',
       'For income smoothing',
       'For window dressing before an IPO or loan',
       'To comply with GAAS',
       'To reduce audit fees'],
 correctSet:[0,1,2,3],
 explanation:'The four reasons managers manage earnings: meeting internal targets (bonuses, loan covenants), meeting external expectations (analyst forecasts, public perception), income smoothing (looking stable), and window dressing (looking good before an IPO or big loan application). GAAS compliance and audit fees aren\'t motivations for earnings management at all.',
 mnemonic:'💡 Memory tip: I-E-S-W — Internal targets, External expectations, Smoothing, Window dressing. Four different audiences, one strategic goal: look good to them.'},

{type:'ord',
 q:'Place the points on the Earnings Management Continuum in order, from the most acceptable/least deceptive to the least acceptable/most deceptive.',
 items:[
   {text:'Savvy Transaction Timing', order:0},
   {text:'Aggressive Accounting (with full disclosure)', order:1},
   {text:'Deceptive Accounting (without disclosure)', order:2},
   {text:'Fraudulent Reporting', order:3},
   {text:'Fraud (fictitious transactions)', order:4}
 ],
 explanation:'The continuum runs from clever-but-honest business practice all the way to outright criminal deception: Savvy Transaction Timing (legitimately timing real transactions) → Aggressive Accounting (pushing estimates but disclosing it) → Deceptive Accounting (pushing estimates without disclosure) → Fraudulent Reporting (non-GAAP, deceptive) → Fraud (inventing transactions that don\'t exist).',
 mnemonic:'💡 Memory tip: "Savvy, Aggressive, Deceptive, Fraudulent, Fraud" — S-A-D-F-F. It gets worse one word at a time until you\'re just making things up.'},

{type:'mc',
 q:'A CFO reviews the company\'s warranty return estimates near year-end specifically because the originally projected numbers would show the company falling short of the profitability the investing public expects. This is best described as an example of:',
 opts:['Meeting external expectations',
       'Meeting internal targets',
       'Income smoothing',
       'Window dressing'],
 correct:0,
 explanation:'The key detail is "what the investing public expects" — this is about how outsiders will perceive the company, which is the core idea of meeting external expectations. It\'s not tied to a specific internal bonus/covenant number (internal targets), a multi-year consistency pattern (income smoothing), or a specific event like an IPO/loan application (window dressing).',
 mnemonic:'💡 Memory tip: Ask "who is this number really for?" If the answer is "outsiders judging the company\'s health," it\'s meeting external expectations — even without a specific analyst figure mentioned.'},

{type:'mc',
 q:'Which of the following best reflects how the earnings management continuum should be understood when a question asks whether certain categories are "always" ethical?',
 opts:['There isn\'t a firm, universal line — the continuum\'s categories blend into each other, so labeling any single point as "always" ethical oversimplifies it',
       'Savvy transaction timing and aggressive accounting are always ethical, no exceptions',
       'Aggressive accounting and deceptive accounting are always ethical',
       'Only fictitious transactions are ever considered unethical'],
 correct:0,
 explanation:'The instructor is explicit that the continuum has no sharp walls between categories — "there\'s not an immediate transition from one to another." Even though there\'s a useful general test (intent to deceive), that test still requires judgment at the fuzzy boundaries, so no category can be called "always" ethical with full confidence.',
 mnemonic:'💡 Memory tip: Watch for the word "always" in ethics questions on a continuum — a continuum, by definition, doesn\'t have hard walls. When in doubt, "it depends / there\'s no clear line" beats an absolute claim.'},

{type:'mc',
 q:'What is the underlying test the instructor uses to judge whether a given earnings management practice is ethical?',
 opts:['Whether there was intent to deceive',
       'Whether the company followed GAAP to the letter',
       'Whether the dollar amount involved is material',
       'Whether the SEC formally investigated the company'],
 correct:0,
 explanation:'The bright-line principle given is: "if you\'re trying to deceive, then it\'s wrong." Staying technically within GAAP (the GAAP Oval) doesn\'t automatically make something ethical — what matters is whether the intent was to mislead the reader.',
 mnemonic:'💡 Memory tip: Not "did you break a rule," but "were you trying to fool someone." Intent to deceive is the line.'},

{type:'mc',
 q:'The "GAAP Oval" concept illustrates that:',
 opts:['Because accounting relies on estimates and judgment, there is a legitimate range of possible reported earnings figures that are all technically GAAP-compliant, not one single "correct" number',
       'GAAP allows companies to report any number they want, with no boundaries at all',
       'Only one exact, objectively correct earnings number exists for any company at any time',
       'GAAP violations are impossible to detect'],
 correct:0,
 explanation:'The GAAP Oval represents the range of earnings figures a company could legitimately report, depending on which reasonable estimates and assumptions it chooses (e.g., useful life, bad debt %). All of these land "inside the oval" and are GAAP-compliant — there isn\'t one single correct dot, but there IS a boundary (outside the oval = fraud).',
 mnemonic:'💡 Memory tip: Picture a cloud, not a dot. Reasonable assumptions land you somewhere inside the cloud (legal); making up numbers lands you outside it (fraud).'},

{type:'tf',
 q:'According to the GAAP Oval concept, if a manager reports earnings anywhere inside the oval, they have definitely acted ethically, regardless of intent.',
 opts:['True','False'],
 correct:1,
 explanation:'False. Being inside the oval only means the number is technically GAAP-compliant. A manager can still be acting unethically if they chose that specific point inside the oval specifically to deceive readers without disclosing what they did — the ethics test is about intent to deceive, not just technical compliance.',
 mnemonic:'💡 Memory tip: "Inside the oval" = legal. "Ethical" is a separate question that depends on whether you were trying to fool someone.'},

{type:'mc',
 q:'"Savvy transaction timing" — such as choosing to sell an appreciated piece of land in the same quarter as an unrelated loss, in order to smooth earnings — sits at which end of the earnings management continuum?',
 opts:['The most acceptable end — it\'s considered a normal, disclosed business practice',
       'The least acceptable end — it\'s equivalent to inventing fictitious transactions',
       'The middle of the continuum, equivalent to deceptive accounting',
       'It isn\'t part of the continuum at all'],
 correct:0,
