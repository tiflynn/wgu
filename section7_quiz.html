/* ========== TOPIC 6.4 — DUPONT FRAMEWORK ========== */

{type:'mc',
 q:'The DuPont Framework is best described as:',
 opts:['A systematic approach to identifying general factors causing Return on Equity to deviate from normal',
       'A method for calculating a company\'s exact tax bill',
       'A system for detecting fraudulent transactions',
       'A method for valuing intangible assets'],
 correct:0,
 explanation:'The DuPont Framework is a systematic approach to identifying general factors causing Return on Equity (net income / stockholders\' equity) to deviate from normal.',
 mnemonic:'💡 Memory tip: DuPont is a diagnostic tool — it doesn\'t just report ROE, it explains WHY ROE is what it is.'},

{type:'mc',
 q:'The DuPont Framework decomposes Return on Equity into which three drivers?',
 opts:['Profitability (Return on Sales), Efficiency (Asset Turnover), and Leverage (Equity Multiplier)',
       'Liquidity, Solvency, and Market Valuation',
       'Revenue, Expenses, and Net Income',
       'Cash Flow, Net Income, and Total Assets'],
 correct:0,
 explanation:'ROE = Return on Sales (profitability) × Asset Turnover (efficiency) × Assets-to-Equity / Equity Multiplier (leverage). Multiplying these three together gives ROE, since the Sales and Total Assets terms cancel algebraically.',
 mnemonic:'💡 Memory tip: "PEL" — Profitability, Efficiency, Leverage — the three levers of DuPont.'},

{type:'mc',
 q:'What is the primary benefit of using the DuPont Framework rather than just calculating ROE directly?',

       'It removes the effects of taxes entirely',
       'It converts all ratios into cash-based measures'],
 correct:0,
 explanation:'The DuPont Framework helps identify WHERE a company\'s return is coming from (profitability, efficiency, or leverage), not just WHAT the return is. Two companies can have the same ROE for completely different underlying reasons.',
 mnemonic:'💡 Memory tip: ROE alone is the "what." DuPont gives you the "why" and "how."'},

{type:'mc',
 q:'Why can a high Return on Equity driven mainly by leverage be a warning sign rather than purely good news?',

       'High leverage automatically lowers Return on Sales',
       'High leverage means the company cannot legally pay dividends'],
 correct:0,
 explanation:'High leverage can inflate ROE, which looks good on paper, but it comes with more financial risk since more debt means more fixed obligations (interest payments) that must be paid regardless of how the business is performing.',
 mnemonic:'💡 Memory tip: Leverage is a magnifying glass — it makes good years look great and bad years look terrible, because the interest bill doesn\'t care how business is going.'},

 mnemonic:'💡 Memory tip: Picture "Sales" as a fraction canceling out like in basic algebra — Margin × Turnover collapses down to ROA.'},

{type:'mc',

 mnemonic:'💡 Memory tip: Anchoring keeps you tied to the past — you have to consciously cut the rope to give new information its proper weight.'},
