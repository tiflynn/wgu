ddle' font-weight='700'>Relationship:</text><text x='410' y='105' font-size='12.5' fill='#1A2035' text-anchor='middle' font-weight='700'>predict Y from X</text><line x1='70' y1='114' x2='70' y2='132' stroke='#5C677D' stroke-width='1.5'/><line x1='240' y1='114' x2='240' y2='132' stroke='#5C677D' stroke-width='1.5'/><line x1='410' y1='114' x2='410' y2='132' stroke='#5C677D' stroke-width='1.5'/><rect x='10' y='132' width='120' height='118' rx='8' fill='#FEF3C7' stroke='#B45309' stroke-width='1.5'/><text x='70' y='154' font-size='13' fill='#1A2035' text-anchor='middle' font-weight='700'>Chi-square</text><text x='70' y='174' font-size='13' fill='#1A2035' text-anchor='middle' font-weight='400'>observed vs</text><text x='70' y='191' font-size='13' fill='#1A2035' text-anchor='middle' font-weight='400'>expected counts</text><text x='70' y='214' font-size='12.5' fill='#1A2035' text-anchor='middle' font-weight='400'>one-way: 1 group</text><text x='70' y='231' font-size='12.5' fill='#1A2035' text-anchor='middle' font-weight='400'>two-way: 2 groups</text><rect x='145' y='132' width='190' height='118' rx='8' fill='#EAF0FC' stroke='#2563EB' stroke-width='1.5'/><text x='240' y='154' font-size='13' fill='#1A2035' text-anchor='middle' font-weight='400'>1 group vs a target</text><text x='240' y='171' font-size='13' fill='#2563EB' text-anchor='middle' font-weight='700'>→ 1-sample t-test</text><text x='240' y='192' font-size='13' fill='#1A2035' text-anchor='middle' font-weight='400'>2 groups, same thing</text><text x='240' y='209' font-size='13' fill='#2563EB' text-anchor='middle' font-weight='700'>→ 2-sample t-test</text><text x='240' y='230' font-size='13' fill='#2563EB' text-anchor='middle' font-weight='700'>3+ groups → ANOVA</text><text x='240' y='245' font-size='12.5' fill='#1A2035' text-anchor='middle' font-weight='400'>(then post hoc)</text><rect x='350' y='132' width='120' height='118' rx='8' fill='#EDE9FE' stroke='#7C3AED' stroke-width='1.5'/><text x='410' y='154' font-size='13                   {
                        type: 'mc',
                        q: "Using y = 0.009(Training) + 0.010(Experience) + 0.855, what is the predicted efficiency for 10 training hours and 2 years of experience?",
                        opts: ["0.965",
                              "0.110",
                              "0.945",
                              "0.875"],
                        correct: 0,
                        explanation: "0.009 × 10 + 0.010 × 2 + 0.855 = 0.09 + 0.02 + 0.855 = <strong>0.965</strong>. Both predictors are significant (p = 0.020 and 0.044). In <strong>multiple regression</strong>, judge fit with <strong>adjusted R²</strong> (0.39): about 39% explained and 61% unexplained.",
                        mnemonic: "💡 Memory tip: <strong>Multiple = more X's, so use Adjusted R².</strong> Add each <strong>coefficient × value</strong>, then the intercept."
                  },

                  {
                        type: 'ms',
                        q: "Which two problems should you watch for in regression models? (Select all that apply.)",
                        opts: ["Multicollinearity: independent variables are correlated with each other",
                              "Autocorrelation: in a time series, each point is influenced by the previous one",
                              "Binary bias: the dependent variable only has two values",
                              "Post hoc drift: p-values change after an ANOVA"],
                        correctSet: [0,1],
                        explanation: "<strong>Multicollinearity</strong> (predictors overlap, which is why 'total experience' replaced 'tenure' alongside 'training') and <strong>autocorrelation</strong> (time series data). A binary outcome simply calls for logistic regression, and post hoc drift isn't a thing.",
                        mnemonic: "💡 Memory tip: <strong>Multi = Many X's tangled; Auto = Auto-follow the last point.</strong> Predictors should be <strong>independent</strong>, not twins."
                  },
