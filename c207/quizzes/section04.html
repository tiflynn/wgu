      <script>
            const questions = [

                  // ══ QUALITY MANAGEMENT: QA vs QC ══════════
                  {
                        type: "mc",
                        q: "Which statement best describes an effective quality management program?",
                        opts: [
                              "It uses both quality assurance (preventing defects) and quality control (detecting defects) in every function, guided by clear goals from leadership.",
                              "It relies only on final inspection by a separate quality department.",
                              "It uses quality control alone, because trying to prevent defects costs too much.",
                              "It applies only to manufacturing, since service functions do not have defects to measure."
                        ],
                        correct: 0,
                        explanation: "Quality is a <strong>culture</strong>, not one department. Purchasing, manufacturing, customer service and talent management each own the quality of their own process with a customer focus. A holistic program combines <strong>assurance (prevent)</strong> and <strong>control (detect)</strong>, and leaders must define and communicate the vision and goals. Fact-based decisions also reduce bias.",
                        mnemonic: "💡 Memory tip: <strong>Quality is everybody's job.</strong> A fire plan needs both smoke prevention (QA) and a fire extinguisher (QC)."
                  },
                  {
                        type: "ms",
                        q: "At a minimum, every member of an organization should be responsible for identifying and communicating which of the following? Select all that apply.",
                        opts: [
                              "Defective product",
                              "Inefficiencies",
                              "Irregularities",
                              "Competitors' pricing strategies",
                              "Executive compensation decisions",
                              "Supplier contract terms"
                        ],
                        correctSet: [0, 1, 2],
                        explanation: "Everyone must know the goals and specifications of the product or service and, at a minimum, <strong>identify and communicate defective product, inefficiencies and irregularities</strong>. Pricing strategy, executive pay and supplier contracts are managed by specific roles, not part of every employee's quality duty.",
                        mnemonic: "💡 Memory tip: <strong>D-I-I: Defects, Inefficiencies, Irregularities.</strong> If you see it, say it."
                  },
                  {
                        type: "dd",
                        q: "Sort each description under quality control (QC) or quality assurance (QA).",
                        cols: ["Quality Control (QC)", "Quality Assurance (QA)"],
                        items: [
                              { text: "Reactive: acts after a problem has occurred", answer: "Quality Control (QC)" },
                              { text: "Corrective action", answer: "Quality Control (QC)" },
                              { text: "Basic level: recognizes problems so they can be fixed", answer: "Quality Control (QC)" },
                              { text: "Goal: uncover defects so they can be fixed", answer: "Quality Control (QC)" },
                              { text: "Proactive: acts before a problem occurs", answer: "Quality Assurance (QA)" },
                              { text: "Preventive action", answer: "Quality Assurance (QA)" },
                              { text: "Advanced level: understands the process well enough to predict outcomes", answer: "Quality Assurance (QA)" },
                              { text: "Major activity: training people so mistakes are not made", answer: "Quality Assurance (QA)" }
                        ],
                        explanation: "<strong>QC</strong> is <strong>reactive</strong>: it assesses performance and recommends <strong>corrective</strong> action after defects appear. <strong>QA</strong> is <strong>proactive</strong>: it assesses the capability of the system or process and recommends <strong>preventive</strong> action. QA is the more advanced level because it requires understanding the process well enough to predict outcomes, which is why <strong>training</strong> is its major activity.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 250' role='img' aria-label='Timeline showing quality assurance acting before a defect and quality control acting after it' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='ar1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5C677D'/></marker></defs><text x='300' y='30' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>When does each one act?</text><line x1='40' y1='120' x2='560' y2='120' stroke='#5C677D' stroke-width='3' marker-end='url(#ar1)'/><circle cx='330' cy='120' r='10' fill='#DC2626'/><text x='330' y='100' font-size='16' fill='#DC2626' text-anchor='middle' font-weight='700'>Defect occurs</text><rect x='40' y='150' width='270' height='78' rx='8' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='175' y='178' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>QA: BEFORE the defect</text><text x='175' y='202' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>proactive, preventive</text><text x='175' y='222' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>training, standards</text><rect x='350' y='150' width='210' height='78' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='455' y='178' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>QC: AFTER the defect</text><text x='455' y='202' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>reactive, corrective</text><text x='455' y='222' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>inspect, find, fix</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>QC = Catch and Clean up. QA = Avoid it in the first place.</strong> Control = Corrective; Assurance = Anticipate."
                  },
                  {
                        type: "tf",
                        q: "True or False: Quality assurance is reactive, because it takes action only after a defect has occurred.",
                        opts: ["True", "False"],
                        correct: 1,
                        explanation: "False. <strong>Quality assurance is proactive</strong>: it acts before problems occur, by preventing defects. It is <strong>quality control</strong> that is reactive and responds after a defect has already happened.",
                        mnemonic: "💡 Memory tip: <strong>QA = Ahead of the problem. QC = Chasing the problem.</strong>"
                  },
                  {
                        type: "mc",
                        q: "Which of the following is an example of quality assurance rather than quality control?",
                        opts: [
                              "Training staff and writing standard operating procedures so that mistakes are not made",
                              "Rejecting a defective batch at final inspection and sending it for rework",
                              "Repairing a defective unit found on the production line",
                              "Recalling a product after customers report a defect"
                        ],
                        correct: 0,
                        explanation: "QA <strong>prevents</strong> errors or defects, for example through training, standard operating procedures, or internal users testing an update before it launches. The other choices all respond to a defect that <strong>already exists</strong>, which makes them QC.",
                        mnemonic: "💡 Memory tip: <strong>Recipe card vs. taste test.</strong> A recipe card (QA) stops bad soup; the taste test (QC) finds it after cooking."
                  },
                  {
                        type: "mc",
                        q: "Who started quality control in 1931 with control charts that were originally named after him?",
                        opts: [
                              "Walter Shewhart",
                              "W. Edwards Deming",
                              "Kaoru Ishikawa",
                              "Vilfredo Pareto"
                        ],
                        correct: 0,
                        explanation: "<strong>Walter Shewhart</strong> began quality control in 1931; the first control charts were called <strong>Shewhart control charts</strong>. Deming carried the ideas forward after World War II, Ishikawa is linked to the seven basic tools, and Pareto gave his name to the 80/20 rule.",
                        mnemonic: "💡 Memory tip: <strong>Shewhart Started it in 1931.</strong> S for Shewhart, S for Start."
                  },
                  {
                        type: "mc",
                        q: "After World War II, who promoted statistical process control and control charts, first in the United States and then in Japan, where they helped rebuild Japanese quality?",
                        opts: [
                              "W. Edwards Deming",
                              "Walter Shewhart",
                              "Lee Iacocca",
                              "Kaoru Ishikawa"
                        ],
                        correct: 0,
                        explanation: "<strong>W. Edwards Deming</strong> used control charts and statistical process control. Few Americans listened at first, so he went to Japan, where manufacturers adopted his methods and grew into global leaders. Shewhart invented the charts in 1931.",
                        mnemonic: "💡 Memory tip: <strong>Deming took it Diaspora:</strong> when the US did not listen, he went to Japan."
                  },

                  // ══ PLAN-DO-CHECK-ACT ══════════
                  {
                        type: "ord",
                        q: "Place the steps of the PDCA cycle in the correct order.",
                        items: [
                              { text: "Plan: investigate the cause of the problem and plan a solution", order: 0 },
                              { text: "Do: try the solution on a small scale", order: 1 },
                              { text: "Check: see whether the problem is still occurring", order: 2 },
                              { text: "Act: make the solution that worked a permanent part of the process", order: 3 }
                        ],
                        explanation: "PDCA is the problem-solving cycle: <strong>Plan</strong> (investigate and plan a fix), <strong>Do</strong> (try it), <strong>Check</strong> (did it work?), <strong>Act</strong> (institutionalize what worked). Plan, Do and Check repeat until something works. In Lean Six Sigma, PDCA is the pilot-test cycle used in the <strong>Improve</strong> phase.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 260' role='img' aria-label='PDCA cycle: Plan, Do and Check are quality control; Act is quality assurance' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='ar2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5C677D'/></marker></defs><text x='300' y='30' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Plan, Do and Check = QC · Act = QA</text><rect x='18' y='80' width='114' height='84' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='75' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Plan</text><text x='75' y='132' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Investigate</text><text x='75' y='152' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>and plan</text><rect x='168' y='80' width='114' height='84' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='225' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Do</text><text x='225' y='132' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Try the fix</text><text x='225' y='152' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>on a trial</text><rect x='318' y='80' width='114' height='84' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='375' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Check</text><text x='375' y='132' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Did it work?</text><text x='375' y='152' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>If not, loop</text><rect x='468' y='80' width='114' height='84' rx='8' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='525' y='108' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Act</text><text x='525' y='132' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Make it the</text><text x='525' y='152' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>new standard</text><path d='M132 122H168' fill='none' stroke='#5C677D' stroke-width='2' marker-end='url(#ar2)'/><path d='M282 122H318' fill='none' stroke='#5C677D' stroke-width='2' marker-end='url(#ar2)'/><path d='M432 122H468' fill='none' stroke='#5C677D' stroke-width='2' marker-end='url(#ar2)'/><path d='M375 80V54H75V80' fill='none' stroke='#DC2626' stroke-width='2' marker-end='url(#ar2)'/><text x='225' y='48' font-size='16' fill='#DC2626' text-anchor='middle' font-weight='400'>still failing: investigate again</text><path d='M18 184V194H282V184' fill='none' stroke='#5C677D' stroke-width='2'/><text x='150' y='218' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Quality control</text><text x='150' y='238' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>reactive: fixes the defect</text><path d='M468 184V194H582V184' fill='none' stroke='#2563EB' stroke-width='2'/><text x='525' y='218' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Quality assurance</text><text x='525' y='238' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>proactive: prevents</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>\"Please Don't Cut Apples.\"</strong> Plan, Do, Check, Act."
                  },
                  {
                        type: "mc",
                        q: "In the PDCA cycle, which step parallels quality assurance rather than quality control?",
                        opts: [
                              "Act",
                              "Plan",
                              "Do",
                              "Check"
                        ],
                        correct: 0,
                        explanation: "<strong>Act</strong> institutionalizes the solution that worked so the problem cannot occur again, which is <strong>prevention</strong>, the heart of QA. Plan, Do and Check fix a problem that already exists, so they parallel QC.",
                        mnemonic: "💡 Memory tip: <strong>P-D-C fix it, A keeps it fixed.</strong> Act = Assurance."
                  },
                  {
                        type: "mc",
                        q: "In PDCA, a team completes the Check step and finds the problem still occurs. What should it do next?",
                        opts: [
                              "Return to investigating and planning, try a different solution, and check again until one works",
                              "Move to Act and make the current solution permanent anyway",
                              "Stop, because Check is the final step of the cycle",
                              "Skip to quality assurance training and end the project"
                        ],
                        correct: 0,
                        explanation: "You only reach <strong>Act</strong> once Check shows a solution actually works. If the problem persists, the team <strong>iterates</strong> through Plan, Do and Check again. A trial of a solution is <strong>Do</strong>, not Act, and institutionalizing a failed fix would lock in the problem.",
                        mnemonic: "💡 Memory tip: <strong>No pass, no promotion.</strong> A fix must pass Check before it graduates to Act."
                  },
                  {
                        type: "mc",
                        q: "A customer reports receiving a batch of defective products, and nobody yet knows why. Which approach should the team begin with?",
                        opts: [
                              "PDCA, starting by investigating what is causing the problem",
                              "Quality control, because defects have already been found",
                              "Quality assurance training, because training prevents defects",
                              "Just-in-Time ordering of new supplies"
                        ],
                        correct: 0,
                        explanation: "When the cause is <strong>unknown</strong>, you cannot yet apply a QC fix. <strong>PDCA</strong> starts with investigating, then planning, trying and checking a solution. QC assumes the problem is already identified. Basic quality tools such as a flowchart can support the investigation, but they are not the whole approach.",
                        mnemonic: "💡 Memory tip: <strong>Detective first, repair second.</strong> Investigate before you plan."
                  },
                  {
                        type: "mc",
                        q: "A variation of PDCA replaces \"Check\" with \"Study.\" What is it called?",
                        opts: [
                              "PDSA (Plan, Do, Study, Act)",
                              "DMAIC",
                              "SIPOC",
                              "PDQA"
                        ],
                        correct: 0,
                        explanation: "<strong>PDSA</strong> swaps Check for <strong>Study</strong>. In the Express session PDCA was described as the version for day-to-day operations, while PDSA is the version that leads toward a Six Sigma approach in quality assurance.",
                        mnemonic: "💡 Memory tip: <strong>Check = tick the box. Study = learn from it.</strong> PDSA: S for Study."
                  },
                  {
                        type: "tf",
                        q: "True or False: Using a control chart to keep an eye on a process so that problems never develop is an example of quality assurance, even though it is called a control chart.",
                        opts: ["True", "False"],
                        correct: 0,
                        explanation: "True. The purpose matters more than the name. If you are <strong>keeping an eye on</strong> a process to make sure there are <strong>no problems</strong>, that is <strong>assurance</strong>, even when the tool is a control chart. Shewhart's original aim was to confirm that nothing was wrong with the system.",
                        mnemonic: "💡 Memory tip: <strong>\"Keep an eye on\" = Assure.</strong> Read the keyword, not the tool name."
                  },

                  // ══ SEVEN BASIC QUALITY TOOLS ══════════
                  {
                        type: "mc",
                        q: "Roughly what share of quality-related problems can the seven basic quality tools solve?",
                        opts: [
                              "90 to 95%",
                              "50 to 60%",
                              "70 to 75%",
                              "99 to 100%"
                        ],
                        correct: 0,
                        explanation: "The seven basic quality tools can solve about <strong>90 to 95%</strong> of the quality problems an organization sees, which is why they are called basic. Each can be used on its own or in combination.",
                        mnemonic: "💡 Memory tip: <strong>Seven tools, ninety-five percent.</strong> 7 tools → 90–95%."
                  },
                  {
                        type: "ms",
                        q: "Select all of the seven basic quality tools.",
                        opts: [
                              "Run chart",
                              "Fishbone (cause-and-effect) diagram",
                              "Flowchart",
                              "Check sheet",
                              "Histogram",
                              "Pareto chart",
                              "Scatter diagram",
                              "SWOT matrix",
                              "Gantt chart",
                              "Decision tree"
                        ],
                        correctSet: [0, 1, 2, 3, 4, 5, 6],
                        explanation: "The seven basic tools are the <strong>run chart, fishbone (cause-and-effect) diagram, flowchart, check sheet, histogram, Pareto chart and scatter diagram</strong>. A control chart is a run chart with limits added. SWOT, Gantt charts and decision trees are useful planning tools but are not among the seven.",
                        mnemonic: "💡 Memory tip: <strong>\"Real Fish Frequently Cook Healthy Pasta Soup.\"</strong> Run, Fishbone, Flowchart, Check, Histogram, Pareto, Scatter."
                  },
                  {
                        type: "dd",
                        q: "Match each description to the tool it fits: run chart, fishbone diagram or flowchart.",
                        cols: ["Run chart", "Fishbone diagram", "Flowchart"],
                        items: [
                              { text: "Tracks performance over time", answer: "Run chart" },
                              { text: "Reveals trends, cycles and seasonal patterns", answer: "Run chart" },
                              { text: "Answers WHY the problem is occurring", answer: "Fishbone diagram" },
                              { text: "Groups possible causes into categories such as people, machines and methods", answer: "Fishbone diagram" },
                              { text: "Answers WHERE in the process the problem occurs", answer: "Flowchart" },
                              { text: "Maps the steps of a process and the order they follow", answer: "Flowchart" }
                        ],
                        explanation: "Match the <strong>question the tool answers</strong>. <strong>Run chart</strong> = performance <em>over time</em>. <strong>Fishbone</strong> (cause-and-effect, also called Ishikawa) = <em>why</em>. <strong>Flowchart</strong> = <em>where</em> in the process. Both fishbone and flowchart help identify a part of the process.",
                        mnemonic: "💡 Memory tip: <strong>Run = Time, Fish = Why, Flow = Where.</strong> The Three Ws and a clock."
                  },
                  {
                        type: "dd",
                        q: "Match each description to the tool it fits.",
                        cols: ["Check sheet", "Histogram", "Pareto chart", "Scatter diagram"],
                        items: [
                              { text: "Collects and tallies how often something occurs", answer: "Check sheet" },
                              { text: "Its data can later be keyed into a spreadsheet or software for analysis", answer: "Check sheet" },
                              { text: "Shows how data is distributed, with the tallest bar in the middle", answer: "Histogram" },
                              { text: "Mean, median and mode are close together, giving a bell-shaped pattern", answer: "Histogram" },
                              { text: "Bars are sorted from tallest to shortest, left to right", answer: "Pareto chart" },
                              { text: "Based on the 80/20 rule: fix the biggest cause first", answer: "Pareto chart" },
                              { text: "Shows the relationship between two variables", answer: "Scatter diagram" },
                              { text: "Shows the strength of an association but not its cause", answer: "Scatter diagram" }
                        ],
                        explanation: "The <strong>check sheet</strong> <em>collects</em> the counts. The <strong>histogram</strong> and <strong>Pareto</strong> both <em>display</em> frequencies as bars: the histogram is centered on the mode, while the Pareto is re-sorted high to low to <em>prioritize</em>. The <strong>scatter diagram</strong> examines how two variables relate.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 272' role='img' aria-label='Histogram with the tallest bar in the middle next to a Pareto chart sorted from tallest to shortest' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='ar3' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5C677D'/></marker></defs><text x='300' y='28' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>A Pareto chart is a re-sorted histogram</text><text x='150' y='62' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Histogram</text><text x='150' y='84' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>tallest bar in the middle</text><text x='450' y='62' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Pareto</text><text x='450' y='84' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>tallest bar first</text><rect x='32' y='205' width='30' height='20' rx='3' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><rect x='68' y='180' width='30' height='45' rx='3' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><rect x='104' y='145' width='30' height='80' rx='3' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><rect x='140' y='115' width='30' height='110' rx='3' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><rect x='176' y='150' width='30' height='75' rx='3' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><rect x='212' y='1 ' font-weight='400'>count it</text><path d='M436 99H454' fill='none' stroke='#5C677D' stroke-width='2' marker-end='url(#ar5)'/><rect x='458' y='62' width='124' height='74' rx='8' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='520' y='94' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Pareto</text><text x='520' y='120' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>prioritize</text><text x='300' y='176' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Locate it, explain it, count it, rank it</text></svg>",
