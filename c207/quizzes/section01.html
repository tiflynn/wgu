                              { text: "Make of a car", answer: "Nominal" },

                              { text: "Calendar year (2023, 2024, 2025)", answer: "Interval" },

                              { text: "Judging a person's health by running speed fails this test", answer: "Validity" },

                        explanation: "Reliable data is consistent and repeatable and depends on the quality of the measuring instrument. Valid data is accurate and appropriate: it represents what is intended to be measured. A puzzle isn't a valid measure of IQ, and running speed isn't a valid measure of health, but blood pressure, cholesterol, and glucose are better measures.",
