      <script>
            const questions = [

                  {
                        type: "mc",
                        q: "What does performance measurement involve?",
                        opts: [
                              "Collecting data and applying analytics to monitor progress and stimulate improvement toward set goals",
                              "Reviewing the financial statements once a year to confirm they were prepared correctly",
                              "Ranking employees against each other so the lowest performers can be replaced",
                              "Surveying customers one time to decide which products to discontinue"
                        ],
                        correct: 0,
                        explanation: "<strong>Performance measurement</strong> is the collection of data and the application of analytics to <strong>monitor progress and stimulate improvements</strong> toward meeting set goals. Leadership must communicate the goals clearly (financial, safety or process goals) so that activities can be put in place to reach them, and metrics are then used to track and improve performance.",
                        mnemonic: "💡 Memory tip: <strong>Measure → Monitor → Improve.</strong> You cannot improve what you do not measure, just as you cannot say you are making good time if you do not know where you are headed."
                  },
                  {
                        type: "mc",
                        q: "Which statement correctly distinguishes a critical success factor (CSF) from a key performance indicator (KPI)?",
                        opts: [
                              "A CSF is a goal or area that is essential to the organization's success; a KPI is the specific metric used to measure performance on it",
                              "A CSF is a numeric metric that is calculated each month; a KPI is a broad goal set by leadership",
                              "A CSF measures customer loyalty; a KPI measures employee learning",
                              "The two terms mean the same thing and are used interchangeably"
                        ],
                        correct: 0,
                        explanation: "The goals leadership sets are the <strong>critical success factors</strong>: the things that must go well. A <strong>KPI</strong> is the number that tracks one of them. For example, <em>growing the customer base</em> is a CSF, while <em>the number of new customers each month</em> is the KPI that measures it.",
                        mnemonic: "💡 Memory tip: <strong>CSF = the destination. KPI = the speedometer reading.</strong> What must go well vs. the number that shows how well it is going."
                  },
                  {
                        type: "ms",
                        q: "To get valid measurements of performance, businesses collect and analyze relevant data from multiple sources. Which of the following are sources of that data? Select all that apply.",
                        opts: [
                              "Financial statements",
                              "Sales figures",
                              "Customer feedback",
                              "Employee performance metrics",
                              "Production data",
                              "Market research",
                              "Unverified opinions of individual managers",
                              "Data selected because it makes the results look good"
                        ],
                        correctSet: [0, 1, 2, 3, 4, 5],
                        explanation: "Valid measurements need <strong>relevant data from multiple sources</strong>: financial statements, sales figures, customer feedback, employee performance metrics, production data and market research. The data must be <strong>accurate and reliable</strong> so that the measurements are objective, consistent and reflect the true state of operations. Opinions and cherry-picked data are neither.",
                        mnemonic: "💡 Memory tip: <strong>Money, Sales, Customers, Employees, Production, Market.</strong> If it is measured and reliable, it counts; if it is an opinion or hand-picked, it does not."
                  },
                  {
                        type: "tf",
                        q: "True or False: Not every performance measure relates to business finances, but performance measures usually affect the financial bottom line.",
                        opts: [
                              "True",
                              "False"
                        ],
                        correct: 0,
                        explanation: "<strong>True.</strong> Goals can be financial, safety-related or process-related. Non-financial measures such as safety, customer loyalty and process quality are not dollar figures, but they usually flow through to profit.",
                        mnemonic: "💡 Memory tip: <strong>Non-financial measures are the roots; the bottom line is the fruit.</strong>"
                  },
                  {
                        type: "dd",
                        q: "Match each performance-measurement tool to the scenario it best fits.",
                        cols: ["KPI", "KPI dashboard", "Balanced scorecard", "Net Promoter Score", "Results-based management"],
                        items: [
                              { text: "Tracking one measure of one target, such as monthly revenue", answer: "KPI" },
                              { text: "Viewing several KPIs side by side on one screen", answer: "KPI dashboard" },
                              { text: "Balancing financial, learning, process and customer goals against long-term strategy", answer: "Balanced scorecard" },
                              { text: "Asking customers how likely they are to recommend the company", answer: "Net Promoter Score" },
                              { text: "Ongoing, life cycle monitoring of actual results against goals", answer: "Results-based management" }
                        ],
                        explanation: "Each tool answers a different question. <strong>KPI</strong>: one measure, one target. <strong>Dashboard</strong>: two or more KPIs displayed together. <strong>Balanced scorecard</strong>: four perspectives (FLIC) tied to long-term strategy. <strong>NPS</strong>: customer loyalty from a would-you-recommend question. <strong>RBM</strong>: ongoing, team based, results-driven management across the life cycle.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 316' role='img' aria-label='Chooser matching business scenarios to KPI, dashboard, balanced scorecard, NPS or results-based management' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='art1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5C677D'/></marker></defs><text x='300' y='26' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Match the scenario to the measure</text><rect x='20' y='44' width='320' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='1.5'/><text x='180' y='72' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>One target, e.g. revenue only</text><line x1='344' y1='66' x2='372' y2='66' stroke='#5C677D' stroke-width='2' marker-end='url(#art1)'/><rect x='376' y='44' width='204' height='44' rx='8' fill='#EAF0FC' stroke='#2563EB' stroke-width='2'/><text x='478' y='72' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>KPI</text><rect x='20' y='98' width='320' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='1.5'/><text x='180' y='126' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Several KPIs on one screen</text><line x1='344' y1='120' x2='372' y2='120' stroke='#5C677D' stroke-width='2' marker-end='url(#art1)'/><rect x='376' y='98' width='204' height='44' rx='8' fill='#EAF0FC' stroke='#2563EB' stroke-width='2'/><text x='478' y='126' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>KPI dashboard</text><rect x='20' y='152' width='320' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='1.5'/><text x='180' y='180' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Strategy across F, L, I and C</text><line x1='344' y1='174' x2='372' y2='174' stroke='#5C677D' stroke-width='2' marker-end='url(#art1)'/><rect x='376' y='152' width='204' height='44' rx='8' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='478' y='180' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Balanced scorecard</text><rect x='20' y='206' width='320' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='1.5'/><text x='180' y='234' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Would customers recommend us?</text><line x1='344' y1='228' x2='372' y2='228' stroke='#5C677D' stroke-width='2' marker-end='url(#art1)'/><rect x='376' y='206' width='204' height='44' rx='8' fill='#FEF3C7' stroke='#B45309' stroke-width='2'/><text x='478' y='234' font-size='16' fill='#B45309' text-anchor='middle' font-weight='700'>Net Promoter Score</text><rect x='20' y='260' width='320' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='1.5'/><text x='180' y='288' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Ongoing, life cycle, results</text><line x1='344' y1='282' x2='372' y2='282' stroke='#5C677D' stroke-width='2' marker-end='url(#art1)'/><rect x='376' y='260' width='204' height='44' rx='8' fill='#D1FAE5' stroke='#059669' stroke-width='2'/><text x='478' y='288' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>Results-based mgmt</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>One, Many, Balanced, Recommend, Results.</strong> Keywords in the question usually give it away: life cycle or ongoing results = RBM; recommend = NPS; four perspectives = BSC."
                  },
                  {
                        type: "ms",
                        q: "Which of the following describe results-based management (RBM)? Select all that apply.",
                        opts: [
                              "It uses a life cycle approach",
                              "It is team based, involving everyone who can influence the outcome",
                              "It focuses on long-term impacts and sustainable outcomes",
                              "It emphasizes simplified indicators that make progress easier to track and ensure accountability",
                              "It focuses only on short-term financial results",
                              "It is carried out only by senior management"
                        ],
                        correctSet: [0, 1, 2, 3],
                        explanation: "RBM has four hallmarks: a <strong>life cycle approach</strong>, <strong>team based</strong> partnership (everyone who can influence the result), a <strong>long-term impact</strong> focus, and <strong>simplified indicators</strong> that streamline evaluation and accountability. It is not limited to short-term finances and it is not owned by senior management alone.",
                        mnemonic: "💡 Memory tip: <strong>Let's Track Long-term Success: Life cycle, Team, Long-term, Simplified indicators.</strong> Exam keywords: results, life cycle, partnership, ongoing."
                  },
                  {
                        type: "tf",
                        q: "True or False: In results-based management, only managers and analysts take part, because other staff cannot influence the outcome.",
                        opts: [
                              "True",
                              "False"
                        ],
                        correct: 1,
                        explanation: "<strong>False.</strong> RBM is <strong>team based</strong> and involves <strong>everyone who can influence the outcome</strong>, which collaboration draws on the strengths and insights of all contributors. Even the person who cleans the offices at night matters: if they do not show up, the next day's work suffers.",
                        mnemonic: "💡 Memory tip: <strong>If the night cleaner skips a shift, the whole day suffers.</strong> Everyone is on the RBM team."
                  },
                  {
                        type: "ord",
                        q: "Place the stages of the results-based management chain in the correct order.",
                        items: [
                              { text: "Inputs: the resources needed to start activities (money, people, tools, materials)", order: 0 },
                              { text: "Activities: the actions that transform inputs into tangible results", order: 1 },
                              { text: "Outputs: the immediate products of the activities (goods, services, new skills)", order: 2 },
                              { text: "Outcomes: the short-term effects, the direct benefits or changes from the outputs", order: 3 },
                              { text: "Impact: the long-term, broader and sustainable change achieved over time", order: 4 }
                        ],
                        explanation: "RBM follows resources through to results: <strong>Inputs → Activities → Outputs → Outcomes → Impact</strong>. Outputs happen right after the activity, outcomes are the short-term effects, and impact is the long-term effect. The whole chain is measured over the life cycle.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 340' role='img' aria-label='Results-based management chain: inputs, activities, outputs, outcomes, impact' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='arq11' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5C677D'/></marker></defs><text x='300' y='26' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Results-based management: resources to long-term change</text><rect x='20' y='44' width='170' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='105' y='72' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Inputs</text><text x='210' y='72' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>Resources: money, people, tools, materials</text><line x1='105' y1='88' x2='105' y2='104' stroke='#5C677D' stroke-width='2' marker-end='url(#arq11)'/><rect x='20' y='104' width='170' height='44' rx='8' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='105' y='132' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Activities</text><text x='210' y='132' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>Actions that turn inputs into results</text><line x1='105' y1='148' x2='105' y2='164' stroke='#5C677D' stroke-width='2' marker-end='url(#arq11)'/><rect x='20' y='164' width='170' height='44' rx='8' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='105' y='192' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Outputs</text><text x='210' y='192' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>Immediate products: goods, services, skills</text><line x1='105' y1='208' x2='105' y2='224' stroke='#5C677D' stroke-width='2' marker-end='url(#arq11)'/><rect x='20' y='224' width='170' height='44' rx='8' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='105' y='252' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Outcomes</text><text x='210' y='252' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>Short-term effects: direct benefits</text><line x1='105' y1='268' x2='105' y2='284' stroke='#5C677D' stroke-width='2' marker-end='url(#arq11)'/><rect x='20' y='284' width='170' height='44' rx='8' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='105' y='312' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Impact</text><text x='210' y='312' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>Long-term, sustainable change over time</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>In All Organizations, Outputs Open Impact:</strong> Inputs, Activities, Outputs, Outcomes, Impact. Immediate, then short term, then long term."
                  },
                  {
                        type: "dd",
                        q: "A job-training program is being managed with results-based management. Match each item to its stage in the RBM chain.",
                        cols: ["Inputs", "Activities", "Outputs", "Outcomes", "Impact"],
                        items: [
                              { text: "Funding, instructors and classroom materials", answer: "Inputs" },
                              { text: "Teaching the training courses", answer: "Activities" },
                              { text: "The number of people who complete the course and earn a certificate", answer: "Outputs" },
                              { text: "Graduates find jobs within six months", answer: "Outcomes" },
                              { text: "Lower unemployment in the region over many years", answer: "Impact" }
                        ],
                        explanation: "<strong>Inputs</strong> are what you put in. <strong>Activities</strong> are what you do with them. <strong>Outputs</strong> are the immediate, countable products. <strong>Outcomes</strong> are the short-term benefits to the target group. <strong>Impact</strong> is the broad, sustainable change that shows up much later.",
                        mnemonic: "💡 Memory tip: <strong>Put in money, teach, count graduates, watch them get jobs, see the region change.</strong> Immediate = output, short term = outcome, long term = impact."
                  },
                  {
                        type: "dd",
                        q: "RBM measures performance across sectors. Match each typical indicator to its sector.",
                        cols: ["Business", "Healthcare", "Education", "Government", "Nonprofit"],
                        items: [
                              { text: "Return on sales (how efficiently sales generate profit)", answer: "Business" },
                              { text: "Hospital-acquired infections (keep them to a minimum)", answer: "Healthcare" },
                              { text: "Graduation rates", answer: "Education" },
                              { text: "Dollars spent (are public funds allocated efficiently?)", answer: "Government" },
                              { text: "Donor retention (secures future funding)", answer: "Nonprofit" }
                        ],
                        explanation: "Performance measures are used in different settings. <strong>Business</strong>: return on sales. <strong>Healthcare</strong>: hospital-acquired infections. <strong>Education</strong>: graduation rates, an indicator of student success and institutional effectiveness. <strong>Government</strong>: dollars spent, to confirm public funds are used efficiently. <strong>Nonprofit</strong>: donor retention, which shows how well funding is maintained.",
                        mnemonic: "💡 Memory tip: <strong>Profit per sale, patients stay healthy, students graduate, taxes spent wisely, donors stay.</strong>"
                  },
                  {
                        type: "mc",
                        q: "A nonprofit charity wants an ongoing monitoring strategy to make sure it is achieving its goals, as measured through actual results. Which approach should it use?",
                        opts: [
                              "Results-based management",
                              "Net Promoter Score",
                              "Balanced scorecard",
                              "Big data analysis"
                        ],
                        correct: 0,
                        explanation: "The keywords are <strong>ongoing</strong>, <strong>goals</strong> and <strong>results</strong>, which point to <strong>results-based management</strong>. NPS only measures customer loyalty, the balanced scorecard balances four perspectives against strategy, and big data analysis is a data-handling approach rather than a monitoring strategy.",
                        mnemonic: "💡 Memory tip: <strong>Ongoing + goals + results = RBM.</strong> Spot the keyword, then eliminate the two answers that cannot fit."
                  },
                  {
                        type: "mc",
                        q: "What does a single key performance indicator (KPI) measure?",
                        opts: [
                              "One target of performance",
                              "All four perspectives of the organization at once",
                              "Customer loyalty across the whole customer base",
                              "The organization's long-term strategy"
                        ],
                        correct: 0,
                        explanation: "A KPI is used to measure <strong>a target of performance</strong>, and <strong>one KPI measures only one target</strong>. That is why a large organization can have dozens, hundreds or even thousands of them.",
                        mnemonic: "💡 Memory tip: <strong>One KPI, one target</strong>, like one gauge in a car with one reading."
                  },
                  {
                        type: "tf",
                        q: "True or False: Because one KPI can measure several targets at once, even a large organization needs only a handful of KPIs.",
                        opts: [
                              "True",
                              "False"
                        ],
                        correct: 1,
                        explanation: "<strong>False.</strong> One KPI measures <strong>only one target</strong>. Organizations may have dozens, hundreds or even thousands of KPIs, depending on the size and diversity of their products and services.",
                        mnemonic: "💡 Memory tip: <strong>One gauge, one reading.</strong> More targets means more KPIs."
                  },
                  {
                        type: "mc",
                        q: "What is a KPI dashboard?",
                        opts: [
                              "A visual display of the performance of a collection of targets or KPIs",
                              "A single metric that measures one target of performance",
                              "A survey that classifies customers as promoters, passives or detractors",
                              "A scorecard that balances financial, learning, process and customer measures against strategy"
                        ],
                        correct: 0,
                        explanation: "A <strong>KPI dashboard</strong> is a visual for the performance of a collection of targets, which means two or more KPIs shown together so decision makers can track them simultaneously. A single metric is a KPI, the survey is the NPS, and the four-perspective tool is the balanced scorecard.",
                        mnemonic: "💡 Memory tip: <strong>Dashboard = a car's instrument panel:</strong> many gauges, one view."
                  },
                  {
                        type: "mc",
                        q: "A manager wants to compare monthly sales for each of eight regions side by side on one screen. Which tool fits best?",
                        opts: [
                              "A KPI dashboard",
                              "A single KPI",
                              "A balanced scorecard",
                              "A Net Promoter Score"
                        ],
                        correct: 0,

th='1.5'/><text x='335' y='156' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Quality</text><rect x='422' y='128' width='146' height='44' rx='6' fill='#FFFFFF' stroke='#2563EB' stroke-width='1.5'/><text x='495' y='156' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Satisfaction</text><text x='125' y='208' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>one KPI = one target</text><text x='415' y='208' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>many KPIs, one view</text></svg>",

>A</text><text x='300' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Attainable</text><text x='300' y='154' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>realistic</text><text x='300' y='176' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>to achieve</text><rect x='362' y='44' width='104' height='170' rx='8' fill='#EAF0FC' stroke='#2563EB' stroke-width='2'/><text x='414' y='86' font-size='32' fill='#2563EB' text-anchor='middle' font-weight='700'>R</text><text x='414' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Relevant</text><text x='414' y='154' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>supports</text><text x='414' y='176' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>objectives</text><rect x='476' y='44' width='104' height='170' rx='8' fill='#EAF0FC' stroke='#2563EB' stroke-width='2'/><text x='528' y='86' font-size='32' fill='#2563EB' text-anchor='middle' font-weight='700'>T</text><text x='528' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Time bound</text><text x='528' y='154' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>has a</text><text x='528' y='176' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>deadline</text></svg>",
