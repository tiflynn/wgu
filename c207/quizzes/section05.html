                            "Balanced scorecard management",
                            "Crossover (cost-comparison) analysis"

                        correct: 0,
                        explanation: "<strong>Results-Based Management (RBM)</strong> is a management approach of <strong>continuous learning and improvement</strong> from the organization's successes and failures. It has five steps, but it is <strong>cyclical</strong>, which is why it is called a <strong>life-cycle approach</strong>. Exam keywords from the Express session: <strong>life cycle, results, ongoing, partnership</strong>.",

                        type: "ms",

                            "It focuses on long-term impact and sustainable results",

ext-anchor='middle' font-weight='700'>Output</text><text x='302' y='146' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>immediate</text><text x='302' y='167' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>product</text><polygon points='358.0,62.0 456.0,62.0 470.0,90.0 456.0,118.0 358.0,118.0 372.0,90.0' fill='#2563EB' stroke='none'/><text x='414' y='96' font-size='16' fill='#FFFFFF' text-anchor='middle' font-weight='700'>Outcome</text><text x='414' y='146' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>short-term</text><text x='414' y='167' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>effect</text><polygon points='470.0,62.0 568.0,62.0 582.0,90.0 568.0,118.0 470.0,118.0 484.0,90.0' fill='#1A2035' stroke='none'/><text x='526' y='96' font-size='16' fill='#FFFFFF' text-anchor='middle' font-weight='700'>Impact</text><text x='526' y='146' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>long-term</text><text x='526' y='167' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>effect</text><path d='M 508 196 L 508 226 L 78 226 L 78 198' fill='none' stroke='#7C3AED' stroke-width='3' marker-end='url(#fig2a)'/><text x='300' y='256' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Cycle: what you learn at Impact shapes the next Inputs</text><text x='300' y='280' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Life-cycle approach</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>I-A-O-O-I</strong>, a lemonade stand: lemons and sugar (Input), squeezing and mixing (Activities), cups ready to sell (Output), first customer reactions (Outcome), neighborhood loyalty by summer's end (Impact)."
                  },

                        mnemonic: "💡 Memory tip: <strong>Resources in, work done, product out, reaction, legacy.</strong>"
                  },

'#1A2035' text-anchor='middle' font-weight='400'>Graduation rates</text><rect x='112' y='160' width='180' height='100' rx='6' fill='#FFEDD5' stroke='#C2410C' stroke-width='2'/><text x='202' y='190' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Government</text><text x='202' y='220' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Dollars spent</text><rect x='308' y='160' width='180' height='100' rx='6' fill='#FEF3C7' stroke='#B45309' stroke-width='2'/><text x='398' y='190' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Non-profit</text><text x='398' y='220' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Donor retention</text></svg>",

                  // ══ INDEX NUMBERS ══════════
                  {

                        correct: 0,
                        explanation: "The CPI is published by the <strong>Bureau of Labor Statistics (BLS)</strong>. It is closely monitored because its rise or fall influences the prices of products, and <strong>inflation affects interest rates</strong>. Index numbers like it can factor into short-term and long-term decisions on contracts and growth.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 250' role='img' aria-label='The same basket of goods priced in the base period and today, compared as an index' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='fig4a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2563EB'/></marker></defs><text x='300' y='26' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>CPI follows the cost of one household basket over time</text><rect x='30' y='48' width='200' height='100' rx='6' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='130' y='80' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Base period</text><text x='130' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>basket costs $100</text><text x='130' y='132' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>(index = 100)</text><line x1='240' y1='98' x2='360' y2='98' stroke='#2563EB' stroke-width='3' marker-end='url(#fig4a)'/><rect x='370' y='48' width='200' height='100' rx='6' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='470' y='80' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Today</text><text x='470' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>same basket: $108</text><text x='470' y='132' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>(index = 108)</text><text x='300' y='184' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Weighted: items count by how much households buy</text><text x='300' y='210' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Watched because a rise or fall signals inflation</text><text x='300' y='234' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>and moves interest rates and prices</text></svg>",

t-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Today on top, base on bottom, then multiply by 100</text></svg>",

ize='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Several goods,</text><text x='298' y='121' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>equal amounts</text><rect x='215' y='150' width='167' height='108' rx='4' fill='#FFFFFF' stroke='#059669' stroke-width='1.5'/><text x='298' y='180' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>Σ current prices</text><text x='298' y='204' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>÷ Σ base prices</text><text x='298' y='228' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>× 100</text><rect x='402' y='12' width='187' height='258' rx='6' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='495' y='38' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Weighted</text><text x='495' y='60' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>composite</text><text x='495' y='100' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Several goods,</text><text x='495' y='121' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>different volumes</text><rect x='412' y='150' width='167' height='108' rx='4' fill='#FFFFFF' stroke='#7C3AED' stroke-width='1.5'/><text x='495' y='180' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Σ(qty × price)</text><text x='495' y='204' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>now ÷ base</text><text x='495' y='228' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>× 100</text></svg>",

                  },
                  {
                        type: "ord",
                        q: "Place the steps for calculating a weighted composite index in the correct order.",
                        items: [
                            { text: "Calculate the weighted total for the base period: the sum of quantity × price for each product", order: 0 },

                        explanation: "<strong>Step 1:</strong> base-period weighted total. <strong>Step 2:</strong> current-period weighted total. <strong>Step 3:</strong> divide current by base and multiply by 100. The two totals must exist before you can divide them, and 'today on top, base on bottom' still applies.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 260' role='img' aria-label='Three steps for a weighted composite index: base total, current total, divide and multiply by 100' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><defs><marker id='fig7a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5C677D'/></marker></defs><rect x='10' y='24' width='170' height='110' rx='6' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='95' y='54' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Step 1</text><text x='95' y='82' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Base total</text><text x='95' y='112' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Σ(qty × price)</text><line x1='184' y1='79' x2='206' y2='79' stroke='#5C677D' stroke-width='3' marker-end='url(#fig7a)'/><rect x='210' y='24' width='170' height='110' rx='6' fill='#D1FAE5' stroke='#059669' stroke-width='2'/><text x='295' y='54' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>Step 2</text><text x='295' y='82' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Current total</text><text x='295' y='112' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Σ(qty × price)</text><line x1='384' y1='79' x2='406' y2='79' stroke='#5C677D' stroke-width='3' marker-end='url(#fig7a)'/><rect x='410' y='24' width='170' height='110' rx='6' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='495' y='54' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>Step 3</text><text x='495' y='82' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Divide</text><text x='495' y='112' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>now ÷ base × 100</text><text x='300' y='176' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Example: base total 200, current total 260</text><text x='300' y='206' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>260 ÷ 200 × 100 = 130</text><text x='300' y='236' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>130 means the combined value is 30% higher</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Base total, Current total, Divide.</strong> B-C-D, just like the alphabet."

                  {
                        type: "mc",
                        q: "Two products are tracked. Base period: 10 units of Product A at $2 and 5 units of Product B at $4. Current period: 20 units of Product A at $3 and 10 units of Product B at $4. What is the weighted composite index?",

                        correct: 0,
                        explanation: "Base total = (10 × 2) + (5 × 4) = <strong>40</strong>. Current total = (20 × 3) + (10 × 4) = <strong>100</strong>. Index = 100 ÷ 40 × 100 = <strong>250</strong>, which is 150% higher than the base. <strong>116.7</strong> is the simple composite trap (it ignores quantities), <strong>40</strong> is just the base total, and <strong>2.5</strong> forgets the × 100. Because each period uses its own quantities, this index reflects price <em>and</em> volume growth; use the course method on the exam.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 260' role='img' aria-label='Worked table: base total 40, current total 100, index 250' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='300' y='26' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Weighted composite: multiply quantity × price, add up, divide</text><rect x='20' y='44' width='560' height='138' rx='6' fill='#FFFFFF' stroke='#5C677D' stroke-width='1.5'/><text x='120' y='72' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Product</text><text x='300' y='72' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Base period</text><text x='480' y='72' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>Current period</text><line x1='20' y1='82' x2='580' y2='82' stroke='#5C677D' stroke-width='1.5'/><text x='120' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>A</text><text x='300' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>10 × $2 = 20</text><text x='480' y='108' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>20 × $3 = 60</text><text x='120' y='136' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>B</text><text x='300' y='136' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>5 × $4 = 20</text><text x='480' y='136' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>10 × $4 = 40</text><line x1='20' y1='148' x2='580' y2='148' stroke='#5C677D' stroke-width='1.5'/><text x='120' y='172' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Total</text><text x='300' y='172' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>40</text><text x='480' y='172' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>100</text><text x='300' y='214' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>100 ÷ 40 × 100 = 250</text><text x='300' y='240' font-size='16' fill='#C2410C' text-anchor='middle' font-weight='400'>Ignoring quantities gives (3 + 4) ÷ (2 + 4) × 100 = 116.7, a trap</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Multiply first (quantity × price), add second, divide last.</strong> No quantities, no weights."

ves it</text><text x='396' y='104' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='700'>+</text><rect x='404' y='46' width='180' height='106' rx='6' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='494' y='76' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Application</text><text x='494' y='106' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>control the</text><text x='494' y='127' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>health problem</text><text x='300' y='192' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>of health-related states or events in specified populations</text><text x='300' y='224' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>CDC: reports on and prevents disease</text></svg>",

ght='400'>of the period</text><rect x='402' y='12' width='187' height='258' rx='6' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='495' y='38' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Incidence</text><text x='495' y='60' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>rate</text><text x='495' y='118' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>new cases in period</text><line x1='416' y1='132' x2='575' y2='132' stroke='#7C3AED' stroke-width='3'/><text x='495' y='160' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>person-time units</text><text x='105' y='238' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='400'>a proportion</text><text x='302' y='238' font-size='16' fill='#059669' text-anchor='middle' font-weight='400'>a proportion</text><text x='499' y='238' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='400'>time per person</text></svg>",

='400'>error (luck)</text><text x='300' y='172' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>No real test is free of random error</text><text x='300' y='200' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Systematic error must be absent for this equation</text><text x='300' y='224' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>True score = the average over an infinite number of tries</text></svg>",

233.5,85.3 239.0,82.4 244.5,80.6 250.0,80.0 255.5,80.6 261.0,82.4 266.5,85.3 272.0,89.2 277.5,94.1 283.0,99.8 288.5,106.1 294.0,112.9 299.5,120.0 305.0,127.2 310.5,134.5 316.0,141.6 321.5,148.5 327.0,155.0 332.5,161.0 338.0,166.6 343.5,171.7 349.0,176.3 354.5,180.3 360.0,183.8 365.5,186.8 371.0,189.3 376.5,191.5 382.0,193.3 387.5,194.7 393.0,195.9 398.5,196.9 404.0,197.6 409.5,198.2 415.0,198.7' fill='none' stroke='#DC2626' stroke-width='3' stroke-dasharray='8 5'/><line x1='40' y1='200' x2='560' y2='200' stroke='#1A2035' stroke-width='2'/><line x1='335' y1='44' x2='335' y2='200' stroke='#2563EB' stroke-width='1.5'/><line x1='250' y1='44' x2='250' y2='200' stroke='#DC2626' stroke-width='1.5'/><text x='343' y='34' font-size='16' fill='#2563EB' text-anchor='start' font-weight='700'>True score</text><text x='242' y='34' font-size='16' fill='#DC2626' text-anchor='end' font-weight='700'>Shifted center</text><line x1='331' y1='70' x2='254' y2='70' stroke='#5C677D' stroke-width='2' marker-end='url(#fig21a)'/><text x='292.5' y='62' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='700'>bias</text><text x='300' y='236' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>Random error = the spread. Shrinks as the sample grows.</text><text x='300' y='264' font-size='16' fill='#DC2626' text-anchor='middle' font-weight='700'>Systematic error = the shift. Stays until its cause is fixed.</text><text x='300' y='292' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Example: a typo in a question hurts every student the same way</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Random = Rolling dice (averages out). Systematic = a Slanted scale (stays slanted).</strong>"
                  },
                  {
                        type: "ms",
                        q: "Select all statements that are true about item analysis of a test question.",
                        opts: [
                            "It checks whether a question truly discriminates between students who know the answer and those who are only guessing",
                            "It starts with the percentage of students who answered the item correctly (the observed score)",
                            "It uses the number of answer choices to estimate the item's difficulty (its true score, p0)",
                            "A difference of 40% or higher between high scorers and low scorers who answered correctly shows the item measures knowledge accurately",
                            "A difference below 40% shows the item measures knowledge accurately",
                            "It splits one test into two halves and compares the results"
                        ],
                        correctSet: [0, 1, 2, 3],
                        explanation: "Item analysis asks whether a question <strong>discriminates</strong> between knowers and guessers. Start with the <strong>observed score</strong> (percent correct), then use the <strong>number of multiple-choice options</strong> to find the item's <strong>difficulty (true score, p0)</strong>. Then compare <strong>high-scoring</strong> students who got it right with <strong>low-scoring</strong> students who got it right: a gap of <strong>40% or more</strong> means the item accurately measures knowledge. Splitting a test into halves is the <strong>split-half</strong> reliability method, not item analysis.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 290' role='img' aria-label='Two test items: item A separates high and low scorers by 50 points so it discriminates; item B separates by only 15 points' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='300' y='24' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Share of each group that answered the item correctly</text><rect x='40' y='64' width='60' height='126' rx='3' fill='#93B4F6' stroke='#2563EB' stroke-width='2'/><text x='70' y='56' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>90%</text><rect x='140' y='134' width='60' height='56' rx='3' fill='#E5E7EB' stroke='#5C677D' stroke-width='2'/><text x='170' y='126' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>40%</text><text x='70' y='212' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>High</text><text x='170' y='212' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Low</text><text x='120' y='240' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Item A</text><text x='120' y='268' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>diff 50 ≥ 40: good item</text><rect x='370' y='92' width='60' height='98' rx='3' fill='#93B4F6' stroke='#2563EB' stroke-width='2'/><text x='400' y='84' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>70%</text><rect x='470' y='113' width='60' height='77' rx='3' fill='#E5E7EB' stroke='#5C677D' stroke-width='2'/><text x='500' y='105' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>55%</text><text x='400' y='212' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>High</text><text x='500' y='212' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Low</text><text x='450' y='240' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Item B</text><text x='450' y='268' font-size='16' fill='#DC2626' text-anchor='middle' font-weight='700'>diff 15 &lt; 40: weak item</text><line x1='20' y1='190' x2='580' y2='190' stroke='#1A2035' stroke-width='2'/></svg>",
                        mnemonic: "💡 Memory tip: <strong>A good question separates the smart from the guessers by at least 40 points.</strong>"
                  },
                  {
                        type: "mc",
                        q: "On a four-option multiple-choice item, 55% of students answered correctly (the observed score). Using observed = [1 + p0 × (4 − 1)] ÷ 4, what is the item's difficulty (true score, p0)?",
                        opts: [
                            "0.40",
                            "0.73",
                            "0.30",
                            "0.55"
                        ],
                        correct: 0,
                        explanation: "Multiply by 4: 0.55 × 4 = 2.2 = 1 + 3 × p0. Subtract 1: 1.2 = 3 × p0. Divide by 3: <strong>p0 = 0.40</strong>. <strong>0.73</strong> forgets to subtract 1 first, <strong>0.30</strong> divides by 4 instead of 3, and <strong>0.55</strong> assumes the observed score is already the true score. The observed score is higher than the true score because some students guess correctly.",
                        mnemonic: "💡 Memory tip: <strong>Guessers inflate the observed score, so the true score is lower.</strong> Subtract the lucky guesses."
                  },
                  {
                        type: "ord",
                        q: "Given observed = [1 + p0 × (k − 1)] ÷ k, where k is the number of answer choices, place the steps for solving for p0 in the correct order.",
                        items: [
                            { text: "Multiply each side of the equation by the denominator (k)", order: 0 },
                            { text: "Subtract 1 from each side", order: 1 },
                            { text: "Divide each side by (k − 1) to get p0 alone", order: 2 },
                            { text: "Read the result: p0 is the item's true score, which is lower than the observed score", order: 3 }
                        ],
                        explanation: "<strong>Step 1:</strong> multiply both sides by the denominator. <strong>Step 2:</strong> subtract 1 from both sides. <strong>Step 3:</strong> divide both sides by (k − 1). <strong>Step 4:</strong> p0 is the true score. Undo the operations in the reverse order of the formula: the division by k comes off first, then the + 1, then the × (k − 1).<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 290' role='img' aria-label='Algebra for item difficulty: multiply by the denominator, subtract 1, divide by the number of options minus 1' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='300' y='26' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Solve for p0 (observed 0.80, 5 options)</text><rect x='20' y='42' width='560' height='54' rx='6' fill='#EEF1F6' stroke='#5C677D' stroke-width='1.5'/><text x='300' y='76' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.80 = [1 + p0 × (5 − 1)] ÷ 5</text><text x='30' y='128' font-size='16' fill='#2563EB' text-anchor='start' font-weight='700'>Step 1</text><text x='120' y='128' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>multiply both sides by 5</text><text x='570' y='128' font-size='16' fill='#2563EB' text-anchor='end' font-weight='700'>4.0 = 1 + 4 × p0</text><text x='30' y='168' font-size='16' fill='#059669' text-anchor='start' font-weight='700'>Step 2</text><text x='120' y='168' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>subtract 1 from both sides</text><text x='570' y='168' font-size='16' fill='#059669' text-anchor='end' font-weight='700'>3.0 = 4 × p0</text><text x='30' y='208' font-size='16' fill='#7C3AED' text-anchor='start' font-weight='700'>Step 3</text><text x='120' y='208' font-size='16' fill='#1A2035' text-anchor='start' font-weight='400'>divide both sides by 4</text><text x='570' y='208' font-size='16' fill='#7C3AED' text-anchor='end' font-weight='700'>p0 = 0.75</text><text x='300' y='268' font-size='16' fill='#C2410C' text-anchor='middle' font-weight='700'>Step 4: true score 0.75 is lower than observed 0.80</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Un-divide, un-add, un-multiply, done.</strong> Peel the formula like an onion, outside in."
                  },
                  {
                        type: "dd",
                        q: "Item response theory (IRT) uses reliability methods to compare observed scores against a true score. Match each description to its method.",
                        cols: ["Parallel forms", "Test-retest", "Split-half"],
                        items: [
                            { text: "Two separate tests are created on the same subject and participants take both", answer: "Parallel forms" },
                            { text: "The scores on the two different test versions are compared", answer: "Parallel forms" },
                            { text: "The same test is given to the same sample of participants twice", answer: "Test-retest" },
                            { text: "The scores from the first and second administrations are compared", answer: "Test-retest" },
                            { text: "One test is divided into two equal parts that each measure the same construct", answer: "Split-half" },
                            { text: "The sample takes each half and the scores on the halves are compared", answer: "Split-half" }
                        ],
                        explanation: "A person often takes a test only once, which gives only an <strong>observed score</strong>. A <strong>reliability index</strong> measures how an observed score compares with a true score, and these three methods are models for representing true scores. <strong>Parallel forms:</strong> two different tests. <strong>Test-retest:</strong> the same test twice. <strong>Split-half:</strong> one test cut into two equal parts. <em>Note:</em> the course text cuts off mid-sentence on these three, so the endings follow the standard definitions.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 290' role='img' aria-label='Three reliability methods: parallel forms uses two tests, test-retest uses one test twice, split-half cuts one test in two' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><rect x='8' y='14' width='187' height='262' rx='6' fill='#DBE7FE' stroke='#2563EB' stroke-width='2'/><text x='101' y='42' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Parallel forms</text><rect x='205' y='14' width='187' height='262' rx='6' fill='#D1FAE5' stroke='#059669' stroke-width='2'/><text x='298' y='42' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Test-retest</text><rect x='402' y='14' width='187' height='262' rx='6' fill='#EDE9FE' stroke='#7C3AED' stroke-width='2'/><text x='495' y='42' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Split-half</text><rect x='24' y='70' width='70' height='44' rx='6' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/><text x='59' y='98' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Test A</text><rect x='112' y='70' width='70' height='44' rx='6' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/><text x='147' y='98' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Test B</text><text x='101' y='150' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>two different tests,</text><text x='101' y='172' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>same subject,</text><text x='101' y='194' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>same people</text><text x='101' y='240' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>compare the two</text><rect x='220' y='70' width='70' height='44' rx='6' fill='#FFFFFF' stroke='#059669' stroke-width='2'/><text x='255' y='92' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Test</text><text x='255' y='110' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Time 1</text><rect x='308' y='70' width='70' height='44' rx='6' fill='#FFFFFF' stroke='#059669' stroke-width='2'/><text x='343' y='92' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Test</text><text x='343' y='110' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Time 2</text><text x='299' y='150' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>same test given</text><text x='299' y='172' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>twice to the same</text><text x='299' y='194' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>sample</text><text x='299' y='240' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>compare the two</text><rect x='418' y='70' width='160' height='44' rx='6' fill='#FFFFFF' stroke='#7C3AED' stroke-width='2'/><line x1='498' y1='70' x2='498' y2='114' stroke='#7C3AED' stroke-width='2'/><text x='458' y='98' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Half 1</text><text x='538' y='98' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Half 2</text><text x='496' y='150' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>one test split into</text><text x='496' y='172' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>two equal halves</text><text x='496' y='194' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>of the same topic</text><text x='496' y='240' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>compare the halves</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Parallel = two lanes (two tests). Test-retest = take two. Split-half = cut the cake in half.</strong>"
                  },

                  // ══ PUBLIC SECTOR ANALYTICS ══════════
                  {
                        type: "ms",
                        q: "A public agency cannot measure payoff with profit. Select all the ways the text says the benefit of an activity or asset can be measured.",
                        opts: [
                            "Safety",
                            "Welfare",
                            "Cost avoidance",
                            "Profit margin",
                            "Shareholder return",
                            "Market share"
                        ],

='1.5'/><text x='315' y='123' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Safety</text><rect x='358' y='100' width='80' height='34' rx='17' fill='#FFFFFF' stroke='#059669' stroke-width='1.5'/><text x='398' y='123' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Welfare</text><rect x='446' y='100' width='132' height='34' rx='17' fill='#FFFFFF' stroke='#059669' stroke-width='1.5'/><text x='512' y='123' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Cost avoidance</text><text x='300' y='204' font-size='16' fill='#C2410C' text-anchor='middle' font-weight='700'>No revenue, so no break-even analysis</text><text x='300' y='232' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Budget goes by need, potential benefit and cost prevention</text></svg>",
