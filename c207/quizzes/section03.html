      <script>
            const questions = [

                  // ══ RISK & PROBABILITY BASICS ══════════
                  {
                        type: "mc",
                        q: "In managerial statistics, what do 'risk' and 'success' mean?",
                        opts: [
                              "Risk: things did not go as planned (or not as well as planned). Success: the desired outcome.",
                              "Risk: a guaranteed financial loss. Success: any outcome that earns a profit.",
                              "Risk: a decision made without any data. Success: a decision made quickly.",
                              "Risk: a sample smaller than 30. Success: a sample that is random."
                        ],
                        correct: 0,
                        explanation: "<strong>Risk</strong> = the result differs from the plan (or is not as good as planned). <strong>Success</strong> = the desired outcome. Probability lets you manage both: know your options, the comparative risk of each, the uncertainties and the outcomes you want. Lower risk raises the odds of success, which turns into profit and efficiency, but managing risk costs money, time and energy.",
                        mnemonic: "💡 Memory tip: <strong>Risk = rain on the picnic; success = the picnic you planned.</strong> Probability is the weather forecast you check before you go."
                  },
                  {
                        type: "mc",
                        q: "A process succeeds 35% of the time (P = 0.35). There are only two outcomes, success or failure. What is the probability of failure?",
                        opts: [
                              "0.65",
                              "0.35",
                              "0.70",
                              "0.30"
                        ],
                        correct: 0,
                        explanation: "Two outcomes are <strong>complements</strong>: P(not E) = 1 − P(E). Here 1 − 0.35 = <strong>0.65</strong> (or 100% − 35% = 65%). Test questions often give you only one side and expect you to find the other. 0.35 repeats the success rate, and 0.70 and 0.30 are arithmetic slips.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 190' role='img' aria-label='Bar split into success 0.35 and failure 0.65 showing complements add to 1' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='300' y='34' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Only two outcomes: they always complete 100%</text><rect x='50' y='56' width='175' height='54' fill='#2563EB' fill-opacity='.25' stroke='#2563EB' stroke-width='2'/><rect x='225' y='56' width='325' height='54' fill='#EEF1F6' stroke='#5C677D' stroke-width='2'/><text x='137' y='90' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Success 0.35</text><text x='387' y='90' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Failure 0.65</text><text x='300' y='142' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>P(not E) = 1 − P(E) = 1 − 0.35 = 0.65</text><text x='300' y='168' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>Percent version: 100% − 35% = 65%</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Complements complete the circle to 1.</strong> Like the other half of a pizza: eat 35% and 65% is left."
                  },
                  {
                        type: "tf",
                        q: "True or False: Two mutually exclusive events can both occur on the same trial.",
                        opts: ["True", "False"],
                        correct: 1,
                        explanation: "False. <strong>Mutually exclusive</strong> events cannot happen together (for example, a project cannot finish in the first fiscal year and the third fiscal year). Their intersection is 0, so the union is simply the sum: P(A or B) = P(A) + P(B). If events can overlap, you must subtract the overlap.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 240' role='img' aria-label='Two separate circles for mutually exclusive events and two overlapping circles for events that can both happen' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='150' y='30' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Mutually exclusive</text><text x='450' y='30' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Not exclusive (overlap)</text><circle cx='95' cy='105' r='55' fill='#2563EB' fill-opacity='.25' stroke='#2563EB' stroke-width='2'/><circle cx='205' cy='105' r='55' fill='#7C3AED' fill-opacity='.25' stroke='#7C3AED' stroke-width='2'/><text x='95' y='111' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>A</text><text x='205' y='111' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>B</text><circle cx='415' cy='105' r='60' fill='#2563EB' fill-opacity='.25' stroke='#2563EB' stroke-width='2'/><circle cx='485' cy='105' r='60' fill='#7C3AED' fill-opacity='.25' stroke='#7C3AED' stroke-width='2'/><text x='385' y='111' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>A</text><text x='515' y='111' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>B</text><text x='450' y='111' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>A∩B</text><text x='150' y='190' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>P(A and B) = 0</text><text x='150' y='214' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Union = P(A) + P(B)</text><text x='450' y='190' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>P(A and B) &gt; 0</text><text x='450' y='214' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>Union = sum − overlap</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>A light switch is on OR off, never both.</strong> Mutually exclusive = no overlap in the Venn diagram."
                  },
                  {
                        type: "mc",
                        q: "A box holds 20 tickets and 5 of them are winners. One winner is drawn and NOT put back. What is the probability that the next ticket drawn is also a winner?",
                        opts: [
                              "4/19",
                              "5/19",
                              "4/20",
                              "5/20"
                        ],
                        correct: 0,
                        explanation: "Without replacement, <strong>both the top and the bottom change</strong>: 4 winners remain among 19 tickets, so 4/19. 5/19 forgets to remove the winner, 4/20 forgets to shrink the total, and 5/20 is the probability of the first draw (or drawing with replacement).",
                        mnemonic: "💡 Memory tip: <strong>Take a bite, shrink the plate.</strong> If the item you took was a 'success', the numerator AND the denominator each drop by 1."
                  },
                  {
                        type: "ms",
                        q: "Which words in a question signal an INTERSECTION, where you multiply the probabilities? Select all that apply.",
                        opts: [
                              "and",
                              "both",
                              "all",
                              "every",
                              "or",
                              "given that"
                        ],
                        correctSet: [0, 1, 2, 3],
                        explanation: "<strong>And, both, all, every</strong> mean every event must happen, so multiply. <strong>Or</strong> (also either, any) signals a union (add, then subtract the overlap). <strong>Given that</strong> (also knowing, if) signals a conditional (Bayes) problem. The most common test cue is 'and'; 'all' and 'both' also appear, 'every' is rare.",
                        mnemonic: "💡 Memory tip: <strong>Multiply the BEANs:</strong> <strong>B</strong>oth, <strong>E</strong>very, <strong>A</strong>ll, a<strong>N</strong>d."
                  },
                  {
                        type: "dd",
                        q: "Classify each question by the probability rule it needs.",
                        cols: ["Intersection (multiply)", "Union (add, subtract overlap)", "Conditional / Bayes (given)"],
                        items: [
                              { text: "What is the probability a customer buys a shirt AND a hat?", answer: "Intersection (multiply)" },
                              { text: "What is the probability it rains OR sleets today?", answer: "Union (add, subtract overlap)" },
                              { text: "Given that a customer bought a shirt, what is the probability they also buy a hat?", answer: "Conditional / Bayes (given)" },
                              { text: "What is the probability a part passes both inspections?", answer: "Intersection (multiply)" },
                              { text: "What is the probability of either a Monday or a Tuesday delivery?", answer: "Union (add, subtract overlap)" },
                              { text: "Knowing that the first test failed, what is the chance the second test also fails?", answer: "Conditional / Bayes (given)" }
                        ],
                        explanation: "Read the <strong>keywords</strong>. <strong>And / both / all / every</strong> = intersection (multiply). <strong>Or / either / any</strong> = union (add, then subtract the overlap). <strong>Given / knowing / if this happens, what is the chance that…</strong> = conditional, where one event happens first and triggers the question.",
                        mnemonic: "💡 Memory tip: <strong>AND = multiply. OR = add (then un-double-count). GIVEN = something happens first.</strong>"
                  },

                  // ══ COMBINING PROBABILITIES ══════════
                  {
                        type: "mc",
                        q: "Events A and B are independent (neither affects the other). P(A) = 0.60 and P(B) = 0.30. What is the probability that A and B both occur?",
                        opts: [
                              "0.18",
                              "0.90",
                              "0.72",
                              "0.30"
                        ],
                        correct: 0,
                        explanation: "An <strong>intersection</strong> multiplies: 0.60 × 0.30 = <strong>0.18</strong>. 0.90 is the plain sum (a union mistake), and 0.72 is the correct <em>union</em>. The two events overlapping in the middle of the Venn diagram is the 0.18.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 300' role='img' aria-label='Venn diagram of events A and B: A only 0.42, both 0.18, B only 0.12, neither 0.28' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='200' y='30' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>A: P = 0.60</text><text x='400' y='30' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>B: P = 0.30</text><circle cx='235' cy='125' r='90' fill='#2563EB' fill-opacity='.25' stroke='#2563EB' stroke-width='2'/><circle cx='365' cy='125' r='90' fill='#7C3AED' fill-opacity='.25' stroke='#7C3AED' stroke-width='2'/><text x='180' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>A only</text><text x='180' y='142' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.42</text><text x='300' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Both</text><text x='300' y='142' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.18</text><text x='420' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>B only</text><text x='420' y='142' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.12</text><text x='34' y='228' font-size='16' fill='#5C677D' text-anchor='start' font-weight='400'>Neither</text><text x='34' y='250' font-size='16' fill='#5C677D' text-anchor='start' font-weight='700'>0.28</text><text x='300' y='252' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>AND (multiply): 0.60 × 0.30 = 0.18</text><text x='300' y='278' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>OR (add, subtract overlap): 0.60 + 0.30 − 0.18 = 0.72</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>AND shrinks the odds.</strong> Two things both happening is always rarer than either one alone, so multiplying two fractions gives a smaller number."
                  },
                  {
                        type: "mc",
                        q: "P(A) = 0.60, P(B) = 0.30 and P(A and B) = 0.18. What is the probability of A OR B?",
                        opts: [
                              "0.72",
                              "0.90",
                              "0.18",
                              "0.42"
                        ],
                        correct: 0,
                        explanation: "<strong>Union</strong> = P(A) + P(B) − P(A and B) = 0.60 + 0.30 − 0.18 = <strong>0.72</strong>. The question never says 'but not counted twice'; that is implied. 0.90 is the trap answer (the plain sum), 0.18 is the intersection, and 0.42 is A only. A union is always at least as large as the intersection.<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 300' role='img' aria-label='Venn diagram of events A and B: A only 0.42, both 0.18, B only 0.12, neither 0.28' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='200' y='30' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>A: P = 0.60</text><text x='400' y='30' font-size='16' fill='#7C3AED' text-anchor='middle' font-weight='700'>B: P = 0.30</text><circle cx='235' cy='125' r='90' fill='#2563EB' fill-opacity='.25' stroke='#2563EB' stroke-width='2'/><circle cx='365' cy='125' r='90' fill='#7C3AED' fill-opacity='.25' stroke='#7C3AED' stroke-width='2'/><text x='180' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>A only</text><text x='180' y='142' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.42</text><text x='300' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Both</text><text x='300' y='142' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.18</text><text x='420' y='120' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>B only</text><text x='420' y='142' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>0.12</text><text x='34' y='228' font-size='16' fill='#5C677D' text-anchor='start' font-weight='400'>Neither</text><text x='34' y='250' font-size='16' fill='#5C677D' text-anchor='start' font-weight='700'>0.28</text><text x='300' y='252' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>AND (multiply): 0.60 × 0.30 = 0.18</text><text x='300' y='278' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>OR (add, subtract overlap): 0.60 + 0.30 − 0.18 = 0.72</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>OR = 'but don't count the middle twice.'</strong> Add both circles, then subtract the overlap you counted two times."
                  },
                  {
                        type: "tf",
                        q: "True or False: To find P(A or B), you simply add P(A) and P(B).",
                        opts: ["True", "False"],
                        correct: 1,
                        explanation: "False, unless the events are mutually exclusive. When the events can both happen, adding counts the overlap twice, so you must <strong>subtract P(A and B)</strong>. If one answer choice is the plain sum, it is the trap.",
                        mnemonic: "💡 Memory tip: <strong>Pizza + pasta night:</strong> if some people ate both, adding the two head-counts double-counts them. Subtract the 'both' crowd."
                  },
                  {
                        type: "mc",
                        q: "P(A and B) = 0.12 and P(A) = 0.40. Using the conditional (Bayes) formula, what is P(B given A)?",
                        opts: [
                              "0.30",
                              "0.048",
                              "0.52",
                              "0.28"
                        ],
                        correct: 0,
                        explanation: "<strong>P(B | A) = P(A and B) ÷ P(A)</strong> = 0.12 ÷ 0.40 = <strong>0.30</strong>. 'Given A' shrinks your universe to the A circle, then you ask what share of it is also B. 0.048 multiplies, 0.52 adds, and 0.28 subtracts. If P(B | A) equals P(B), knowing A told you nothing new about B (the events are independent).<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 296' role='img' aria-label='Venn diagram where circle A is the given event and the overlap with B is divided by A' style='display:block;width:100%;max-width:600px;height:auto;margin:.8rem auto .3rem;background:#F7F9FD;border:1px solid #C8D1E4;border-radius:8px'><text x='300' y='28' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>Given A, the universe shrinks to circle A</text><circle cx='345' cy='130' r='85' fill='none' stroke='#5C677D' stroke-width='2' stroke-dasharray='6 5'/><circle cx='235' cy='130' r='85' fill='#2563EB' fill-opacity='.20' stroke='#2563EB' stroke-width='4'/><path d='M290.0,65.2 A85,85 0 0 1 290.0,194.8 A85,85 0 0 1 290.0,65.2 Z' fill='#059669' fill-opacity='.55' stroke='none'/><text x='190' y='125' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>A</text><text x='190' y='147' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='400'>(given)</text><text x='290.0' y='136' font-size='16' fill='#1A2035' text-anchor='middle' font-weight='700'>A∩B</text><text x='400' y='136' font-size='16' fill='#5C677D' text-anchor='middle' font-weight='400'>B</text><text x='300' y='252' font-size='16' fill='#2563EB' text-anchor='middle' font-weight='700'>P(B | A) = P(A and B) ÷ P(A)</text><text x='300' y='278' font-size='16' fill='#059669' text-anchor='middle' font-weight='700'>= 0.12 ÷ 0.40 = 0.30</text></svg>",
                        mnemonic: "💡 Memory tip: <strong>Given = the gate.</strong> Walk through the gate into circle A, then divide by the size of A: P(A and B) ÷ P(A)."
                  },
                  {
                        type: "mc",
                        q: "What is the key difference between a Bayes (conditional) problem and a plain intersection problem?",
                        opts: [
                              "In a Bayes problem one event must happen first and triggers the question about the second event.",
                              "In a Bayes problem you add the probabilities instead of multiplying them.",
                              "A Bayes problem only works when the two events are mutually exclusive.",
                              "An intersection problem needs a sample of more than 30 but a Bayes problem does not."
                        ],
                        correct: 0,
                        explanation: "Both involve two events, but Bayes has an <strong>order</strong>: something happens first (the trigger) and then you ask about the second event. Cue words are <strong>given, knowing, if this happens</strong>. 'P(A and B)' is an intersection; 'given A, what is P(B)?' is Bayes. Bayes is a bit like walking down a decision tree: combine the branch probabilities and compare outcomes.",
                        mnemonic: "💡 Memory tip: <strong>Intersection = a tie with no order. Bayes = a starting gun.</strong> The 'given' event goes off first."
                  },
                  {
                        type: "tf",
                        q: "True or False: In a probability tree, the probabilities of all the complete paths (final outcomes) add up to 1.00.",
                        opts: ["True", "False"],
