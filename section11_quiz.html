{type:'mc',

{type:'mc',

{type:'tf',
 q:'Per the textbook review, companies that better understand their costs have an advantage over their competitors.',

{type:'mc',
 q:'Per the textbook review, when using an ABC system, a company identifies specific business activities that create overhead costs and then:',
 opts:['Assigns overhead to products or divisions based on the level of those activities',

 correct:0,

{type:'tf',

{type:'ord',

 ],

{type:'mc',
 q:"Can a real company's ABC analysis be limited to exactly four overhead cost activities — one per category — the way Lily's simplified example is structured?",

/* ========== TOPIC 10.2 — THE FOUR ABC CATEGORIES ========== */

{type:'mc',
 q:'Unit-level activities are best defined as:',
 opts:['Activities that take place each time a unit of product is produced',

       'Activities that take place to support a product line, regardless of the number of batches or units produced',
       'Activities necessary just to have a production facility in place'],
 correct:0,
 explanation:"Unit-level costs scale directly with production volume — make one more unit, and you trigger the activity one more time. This is the traditional, intuitive kind of overhead.",
 mnemonic:'💡 Memory tip: Unit-level = "per unit." More gallons, more cost, in direct proportion.'},

{type:'ms',
 q:'Which of the following are textbook examples of unit-level overhead costs? Select all that apply.',

 correctSet:[0,1,2],
 explanation:"Machine maintenance, machine depreciation, and electricity are all routine costs of simply running the machines — they scale with volume produced. Machine setups are batch-level (triggered by switching production runs), and property taxes are facility support (exist regardless of production).",
 mnemonic:'💡 Memory tip: Unit-level = keeping the machines running: maintenance, depreciation, power.'},

{type:'mc',
 q:'Batch-level activities are best defined as:',
 opts:['Activities that take place in order to support a batch or production run, regardless of the size of the batch',

       'Activities necessary just to have a production facility in place'],
 correct:0,
 explanation:'Batch-level costs are triggered by the act of starting and stopping production — not by volume and not by how complex the recipe is. A huge batch and a tiny batch each trigger the same batch-level cost once.',
 mnemonic:'💡 Memory tip: Batch-level = "per batch," not "per gallon." Stop, clean, start — that act itself costs money.'},

{type:'ms',
 q:'Which of the following are textbook examples of batch-level overhead costs? Select all that apply.',

 explanation:'Inspections, machine setups, and moving/accounting for materials all happen because production is stopping and starting between batches. Engineering product design is product-line overhead, and factory insurance is facility support.',
 mnemonic:'💡 Memory tip: Batch-level = everything that happens at a "changeover": inspect, set up, move materials.'},

{type:'mc',
 q:'Product line (product-sustaining) activities are best defined as:',
 opts:['Activities that take place in order to support a product line, regardless of the number of batches or individual units produced',

       'Activities that take place in order to support a batch or production run, regardless of batch size',
       'Activities necessary just to have a production facility in place'],
 correct:0,
 explanation:"Product-line overhead exists because a product/flavor exists at all — regardless of how many gallons or batches of it get made. A flavor with 25 ingredients demands ongoing chemist attention no matter the batch size.",

{type:'ms',

       'Activities that take place in order to support a product line, regardless of number of batches or units produced'],
 correct:0,

 mnemonic:"💡 Memory tip: Facility support = the cost of the lights being on, whether or not anyone's making ice cream."},

 mnemonic:'💡 Memory tip: Facility support = the "keeping the lights on" bill: taxes, insurance, security, landscaping, admin.'},

 q:'Using the unit-level cost pool ($750,000) and total gallons produced (1,500,000), what is the overhead rate per gallon?',
